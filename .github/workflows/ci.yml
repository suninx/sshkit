name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 类型关 + 单元/集成测试 + 构建(纯 Node,最快)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;这里不再写 version,
        # 否则 action 会报 "Multiple versions of pnpm specified"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  # 端到端:直接驱动 Electron,无头环境用 xvfb
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;这里不再写 version,
        # 否则 action 会报 "Multiple versions of pnpm specified"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Electron 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libsecret-1-0
      - name: 确保 Electron 二进制就位
        # 干净安装时 electron 的下载步骤可能没落地(CI 实测:dist 缺失 → e2e 启动超时、
        # electron-builder 报 "electronDist does not exist")。显式补齐,幂等。
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            node node_modules/electron/install.js
          fi
          ls node_modules/electron/dist >/dev/null && echo "electron dist ok"
      # node-pty 必须按 Electron 的 ABI 重编,否则 Electron 主进程 require 它会直接崩,
      # 表现就是 Playwright 等不到窗口(firstWindow 超时)。
      - run: pnpm run rebuild:pty
      - run: pnpm run build
      - name: 冒烟:主进程能否加载(诊断用,失败不阻塞后续)
        continue-on-error: true
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          timeout 25 xvfb-run -a ./node_modules/.bin/electron . --no-sandbox 2>&1 | head -60 || true
      - run: xvfb-run -a pnpm run test:e2e
        env:
          ELECTRON_ENABLE_LOGGING: "1"

  # 打包产物(仅 main;未签名,供本机自用/后续接入签名与公证)
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;这里不再写 version,
        # 否则 action 会报 "Multiple versions of pnpm specified"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 确保 Electron 二进制就位
        # 干净安装时 electron 的下载步骤可能没落地(CI 实测:dist 缺失 → e2e 启动超时、
        # electron-builder 报 "electronDist does not exist")。显式补齐,幂等。
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            node node_modules/electron/install.js
          fi
          ls node_modules/electron/dist >/dev/null && echo "electron dist ok"
      - run: pnpm run build
      - run: pnpm exec electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sshkit-mac-arm64
          path: release/*.zip
          if-no-files-found: error
