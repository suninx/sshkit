name: CI (Windows)

# Windows 平台门:类型关 + 单元/集成测试 + 构建(必需),e2e(best-effort),打包(仅 main)。
# 与 Linux/macOS 的 ci.yml 平行;本文件只新增 Windows 流程,不改 ci.yml / electron-builder.yml。
# 注意:仓库里 package.json 的 packageManager(pnpm@11.21.0)是 pnpm 版本的唯一来源,
# 下面 pnpm/action-setup 一律不写 version(写了会报 "Multiple versions of pnpm specified")。
on:
  push:
    branches: [main]
  pull_request:

# concurrency group 是**仓库级共享**的(跨 workflow 生效),不能沿用 ci.yml 的
# `ci-${{ github.ref }}`,否则 Linux/macOS 与 Windows 两条 workflow 同 ref 同时跑时会互相取消。
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:checkout 只需要读仓库。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- test
  # 类型关 + 单元/集成测试 + 构建(纯 Node,Windows 上最快的门)。
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;不要写 version。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  # ---------------------------------------------------------------- e2e
  # 端到端:Windows runner 上 Playwright 驱动真实 Electron。
  #
  # 为什么 best-effort(continue-on-error: true):
  #   1) windows-latest 是 Server 版 runner,窗口合成/GPU/ConPTY 与桌面 Windows/macOS 有差异,
  #      Playwright 的 firstWindow 超时这类环境性失败会长期把 workflow 染红,而这并不代表产品回归;
  #   2) 本 workflow 的硬门是 test/package 两个 job,e2e 只作为诊断信息(失败时仍上传 trace/日志);
  #   3) 等 Windows 侧环境稳定(或改自托管 Windows runner)后,删掉这一行即可升级为硬门。
  e2e:
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;不要写 version。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 确保 Electron 二进制就位
        # 干净安装时 electron 的下载步骤可能没落地(ci.yml 实测:dist 缺失 → e2e 启动超时)。
        # electron-builder.yml 的 electronDist 指向 node_modules/electron/dist,缺了必须先补;幂等。
        # Windows 上 `shell: bash` 用的是 runner 自带的 Git Bash。
        shell: bash
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            node node_modules/electron/install.js
          fi
          ls node_modules/electron/dist >/dev/null && echo "electron dist ok"
      - name: 诊断:Electron 下加载原生模块(不阻断)
        # node-pty 1.1.0 / keytar 7.9.0 都是 Node-API(NAPI)prebuild:
        #   - node-pty 自带 prebuilds/win32-x64(pty.node 导出 napi_register_module_v1);
        #   - keytar 的 binary.napi_versions=[3]。
        # 所以 Windows 上**不需要** electron-rebuild(`pnpm run rebuild:pty` 会走 node-gyp/VS 工具链,
        # 只在 Linux e2e 上才必要——node-pty 没有 linux prebuild)。这里只做一次加载冒烟,失败仅记日志。
        continue-on-error: true
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron.exe -e 'require("node-pty"); require("keytar"); console.log("native modules OK under Electron", process.versions.electron)'
      - name: E2E(Playwright 驱动真实 Electron;pretest:e2e 会自动 build)
        run: pnpm run test:e2e
        env:
          ELECTRON_ENABLE_LOGGING: "1"
      - name: 失败时保留 Playwright 日志/trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-results
          path: test-results/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------- package
  # 打包产物(仅 main;未签名,供本机自用/后续接入 Windows 代码签名)。
  # 不能复用 package.json 的 `dist` / `dist:dir` 脚本:它们是 macOS 专用(`--mac --arm64`),
  # 其 --mac 参数在 Windows host 上不适用;这里直接调 electron-builder CLI。
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定;不要写 version。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 确保 Electron 二进制就位
        # electron-builder.yml 用 electronDist: node_modules/electron/dist(本机分发,不联网下载),
        # 干净安装时该目录可能没落地,显式补齐;幂等。
        shell: bash
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            node node_modules/electron/install.js
          fi
          ls node_modules/electron/dist >/dev/null && echo "electron dist ok"
      - run: pnpm run build
      # electron-builder.yml 目前只有 mac 段、没有 win 段(本任务不允许改它):
      #   - 默认 target 是 nsis(app-builder-lib winPackager.defaultTarget = ["nsis"]),
      #     产物是 release/*.exe 安装器;不会产出 *.zip —— 要让 zip 出现需在 electron-builder.yml
      #     加 `win: { target: [nsis, zip] }`(并建议补 build/icon.ico;当前 build/ 只有 .icns/.png);
      #   - electron-builder 默认 npmRebuild=true,会为原生依赖做一次 rebuild;node-pty/keytar 是
      #     NAPI,理论上可跳过,但那是 electron-builder.yml 的配置,不在本文件写死命令行覆盖。
      - run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sshkit-win-x64
          # upload-artifact@v4 只有在**所有** path 都没命中时才按 if-no-files-found 失败
          # (v4 源码 src/upload/upload-artifact.ts:filesToUpload.length === 0 分支);
          # 当前配置会产出 exe,所以即便 zip 不存在也不会让这个 step 变红。
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
