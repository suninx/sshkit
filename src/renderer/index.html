<!doctype html>
<html>
<head>
  <title>sshkit</title>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <link rel="stylesheet" href="./xterm.css">
  <style>
    /* T1 复刻:原版终端字体 = MesloLGS Nerd Font Mono(Nerd Fonts 3.2.1,Apache-2.0)。
       字体取自上游官方 release,与原版包内文件逐字节一致;见 src/renderer/fonts/LICENSE.txt。 */
    @font-face {
      font-family: "MesloLGS NF";
      src: url("./fonts/MesloLGSNerdFontMono-Regular.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: "MesloLGS NF";
      src: url("./fonts/MesloLGSNerdFontMono-Bold.ttf") format("truetype");
      font-weight: 700; font-style: normal; font-display: block;
    }
    :root {
      /* ===== 配色:全部取自原版自身(有据)=====
         内容区 #1D2033 与 导航栏 #282B3D 来自其包内 SVG 填充(精确值);
         #3E4257(活动项/搜索框)、#3F4352(次要按钮面)、#2091F6(强调蓝)来自其调色数组;
         顶栏 ≈#313443、次要文字 #8D92A5、图标 #6E7281、禁用 #5A5F73 由截图逐像素量得。 */
      --bg: #1d2033;        /* 内容区 */
      --bg2: #282b3d;       /* 导航栏 / 卡片 */
      --bg3: #313443;       /* 顶栏(含 tab 条) */
      --panel: #3e4257;     /* 活动项 / 搜索框 / 悬停面 */
      --btn2: #3f4352;      /* 次要按钮面 */
      --wire: #343851;      /* 1px 分隔 */
      --fg: #ffffff; --fg-dim: #8d92a5; --icon-dim: #6e7281; --disabled: #5a5f73;
      --accent: #2091f6; --danger: #ff7375;
      --tl-inset: 78px;     /* 顶栏左端给红绿灯让出的宽度(原版:红绿灯 x 9..68,首个 pill 从 83 开始) */ --h04: rgba(255,255,255,.04); --h05: rgba(255,255,255,.05); --h06: rgba(255,255,255,.06); --h07: rgba(255,255,255,.07); --h08: rgba(255,255,255,.08); --h09: rgba(255,255,255,.09); --h10: rgba(255,255,255,.1); --h11: rgba(255,255,255,.11); --h12: rgba(255,255,255,.12);
      --fg-strong: #ffffff;
      --term-bg: #141729; /* 终端主题底色,tab 条随之变化(原版实测如此) */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.4 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
    #app { display: flex; height: 100%; }

    /* sidebar */
    #sidebar { width: 240px; min-width: 200px; background: var(--bg2); border-right: 1px solid var(--wire);
      display: flex; flex-direction: column; }
    #sidebar .top { padding: 10px 12px 8px; display: flex; align-items: center; gap: 8px; }
    #sidebar .brand { font-weight: 600; letter-spacing: .3px; }
    #host-list { flex: 1; overflow-y: auto; padding: 2px 6px 8px; }
    .group-label { color: var(--fg-dim); font-size: 11px; text-transform: uppercase;
      letter-spacing: .6px; padding: 10px 8px 3px; }
    .host-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
      cursor: pointer; user-select: none; }
    .host-item:hover { background: var(--bg3); }
    .host-item.active { background: var(--bg3); outline: 1px solid var(--wire); }
    .host-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host-item .small { color: var(--fg-dim); font-size: 11px; }
    .host-item .btn { visibility: hidden; }
    .host-item:hover .btn { visibility: visible; }
    /* 键盘用户把焦点移进按钮时同样显形(纯 hover 才能看到操作是可达性缺陷) */
    .host-item:focus-within .btn { visibility: visible; }
    .empty-hint { color: var(--fg-dim); padding: 12px 10px; }
    /* 空态:居中的"创建主机"卡片(对齐原版实测:卡片宽 383、图标 50×50、蓝色 Continue) */
    /* #host-list 是两列 grid(装主机卡片),空态卡片必须跨满整行并在内容区居中;
       否则它只占一列,看起来"歪在左边"(实测踩到)。垂直位置按原版实测 ≈26vh。 */
    .hosts-empty { grid-column: 1 / -1; display: flex; justify-content: center; padding: 24vh 0 0; }
    .he-inner { width: 383px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .he-ico { width: 50px; height: 50px; border-radius: 13px; background: var(--panel);
      display: flex; align-items: center; justify-content: center; color: var(--fg); margin-bottom: 26px; }
    .he-title { font-size: 19px; font-weight: 600; color: var(--fg); margin-bottom: 10px; }
    .he-sub { font-size: 13px; color: var(--fg-dim); margin-bottom: 22px; line-height: 1.5; }
    .he-addr { width: 100%; height: 38px; border-radius: 8px; background: var(--bg2);
      border: 1px solid #3a6df0; color: var(--fg); padding: 0 12px; font-size: 13px; outline: none; }
    .he-cta { width: 100%; height: 38px; margin-top: 14px; border: 0; border-radius: 8px;
      background: #2f6bff; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .he-cta:hover { background: #3d78ff; }

    /* buttons */
    .btn { border: 1px solid var(--wire); background: var(--bg3); color: var(--fg);
      border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
    .btn:hover { border-color: var(--fg-dim); }
    .btn.primary { background: #2e6b7a; border-color: #3f8ba0; color: #eafbff; }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* main area */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #banner { display: none; padding: 8px 14px; background: #4b2b31; color: #f0c4c9;
      border-bottom: 1px solid var(--danger); white-space: pre-wrap; }
    #banner.visible { display: block; }
    #term-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--bg2); border-bottom: 1px solid var(--wire); min-height: 34px; }
    #status-dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5563; }
    #status-dot.on { background: #a3be8c; } #status-dot.off { background: var(--danger); }
    #term-title { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #term-wrap { flex: 1; padding: 6px; min-height: 0; }
    #term { width: 100%; height: 100%; }

    /* T2 复刻 —— tab 条。原版实测:条高 51px、底色=终端主题底色(#141729)、
       tab 高 30px/圆角 10px、非活动=5% 白叠加、活动会话 tab=#21b568 20% 叠加、
       关闭按钮约 21×23 圆角 5、会话图标为绿色圆点。
       快捷键亦取自原版自身的 shortcut_schemes:Cmd+T 新建 / Cmd+W 关闭 /
       Cmd+Shift+[ ] 前后切换。 */
    /* 原版顶栏是一条 49px 的通栏(红绿灯浮在其上),tab 是其中的 pill。
       实测:顶栏底 #313443;不再跟随终端主题底色(此前那版跟随是错的观测)。 */
    #tabstrip { display: flex; align-items: center; gap: 6px; height: 49px;
      padding: 0 10px 0 var(--tl-inset); background: var(--bg3); border-bottom: 0;
      -webkit-app-region: drag; }
    #tabstrip button, #tabstrip .tab-btn { -webkit-app-region: no-drag; }
    #tabs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
    .tab-btn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 6px;
      border-radius: 10px; background: var(--h05); color: var(--term-fg); cursor: pointer;
      font-size: 13px; max-width: 240px; min-width: 0; user-select: none; flex: none; }
    .tab-btn:not(.session) { padding-left: 12px; }
    .tab-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7a8c; flex: none; }
    .tab-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-btn.active { background: var(--h10); color: var(--term-fg); }
    .tab-btn.session.active { background: rgba(33,181,104,.2); color: #21b568; }
    .tab-btn.session .dot.on { background: #21b568; }
    .tab-close { border: 0; background: transparent; color: inherit; opacity: .5; border-radius: 5px;
      width: 21px; height: 23px; padding: 0; cursor: pointer; font-size: 11px; flex: none; }
    .tab-close:hover { opacity: 1; background: var(--h12); }
    #btn-new-tab { width: 30px; height: 30px; border: 0; border-radius: 10px; background: transparent;
      color: var(--term-fg); font-size: 16px; cursor: pointer; flex: none; }
    #btn-new-tab:hover { background: var(--h08); }
    #stage { flex: 1; min-height: 0; position: relative; }
    /* 注意:类名必须与 SFTP 弹层的 .pane/.panes 区分开(否则 position:absolute 会把 SFTP 布局弄坏) */
    .tab-pane { position: absolute; inset: 0; display: none; }
    .tab-pane.active { display: block; }
    /* 原版终端是**贴满**整个内容区的(会话态截图 x=0..1279、y 从 50 起都是终端底色),
       我早期给 .term-host 加的 6px 内边距会露出底下一层 #282c3c,看起来像一圈浅边框。 */
    .tab-pane .term-host { position: relative; width: 100%; height: 100%; padding: 0; box-sizing: border-box;
      background: var(--term-bg); }   /* 终端行高取整后底部会剩几像素,原版那里也是终端底色 */

    /* T4 复刻 —— 终端内搜索栏。原版实测:Cmd+F 在终端区右上出现,输入框占位符
       "Search terminal - ⌘ + F",右侧有上/下箭头按钮。 */
    .term-search { position: absolute; right: 10px; top: 8px; z-index: 5; display: flex; align-items: center;
      gap: 2px; background: var(--bg2); border: 1px solid var(--wire); border-radius: 10px; padding: 3px 4px 3px 10px; }
    .term-search[hidden] { display: none; }
    .term-search .ts-ico { display: flex; align-items: center; color: var(--accent); opacity: .9; }
    .term-search input { width: 220px; background: transparent; border: 0; outline: none; color: var(--fg);
      font-size: 13px; padding: 4px 2px; }
    .ts-btn { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; border-radius: 6px;
      width: 22px; height: 22px; font-size: 12px; }
    .ts-btn:hover { background: var(--h09); color: var(--fg); }

    /* T4 —— 未实现的快捷键显式告知(不静默吞键) */
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 60;
      background: rgba(20,23,41,.97); border: 1px solid var(--wire); color: var(--fg);
      padding: 9px 14px; border-radius: 9px; font-size: 13px; transition: opacity .5s; }
    .toast.out { opacity: 0; }

    /* T4 —— Cmd+K 命令面板 */
    .palette-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex;
      align-items: flex-start; justify-content: center; padding-top: 90px; z-index: 55; }
    .palette { width: min(560px, 88vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; overflow: hidden; }
    .palette input { width: 100%; box-sizing: border-box; background: transparent; border: 0;
      border-bottom: 1px solid var(--wire); outline: none; color: var(--fg); font-size: 14px; padding: 13px 15px; }
    .pal-list { max-height: 320px; overflow-y: auto; padding: 5px; }
    .pal-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .pal-row:hover { background: var(--h08); }
    .pal-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pal-hint { color: var(--fg-dim); font-size: 12px; }

    /* 新 tab 落地页。原版实测:居中搜索框(约占宽 667、高 36、圆角 10)、右侧 ⌘+K 提示、
       下方图标 + "Recent sessions" 标题(18px/500)+ 两行提示语。 */
    .newtab { height: 100%; display: flex; flex-direction: column; align-items: center; }
    .nt-search { position: relative; width: min(667px, 70%); margin-top: 41px; }
    .nt-search input { width: 100%; height: 36px; border-radius: 10px; border: 1px solid transparent;
      background: #d5dde0; color: #141729; padding: 0 64px 0 14px; font-size: 14px; outline: none; }
    .nt-search input:focus { border-color: #2091f6; }
    .nt-search .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #798c94; font-size: 14px; font-weight: 450; pointer-events: none; }
    .nt-empty { margin-top: 210px; text-align: center; color: var(--fg-dim); }
    .nt-icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 14px; background: #e6ebed;
      display: flex; align-items: center; justify-content: center; font-size: 26px; color: #141729; }
    .nt-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; color: var(--fg); }
    .nt-empty p { margin: 0; font-size: 14px; line-height: 1.55; }

    /* T2 复刻 —— tab 拖拽重排(原版有 over-horizontal-tab / over-draft-horizontal-tab 拖放态)、
       右键菜单(原版 TAB_CONTEXT_MENU_OPENED)与重命名(SINGLE_TERMINAL_TAB_RENAMED) */
    .tab-btn.dragging { opacity: .45; }
    .tab-btn.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
    .tab-btn.drop-after { box-shadow: inset -2px 0 0 var(--accent); }
    .tab-menu { position: fixed; z-index: 60; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 9px; padding: 5px; min-width: 150px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
    .tab-menu-item { display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: var(--fg); font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    .tab-menu-item:hover { background: var(--h08); }
    .tab-rename { width: 96px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent);
      border-radius: 5px; font-size: 13px; padding: 1px 4px; outline: none; }

    /* T5 复刻 —— 栏间拖拽传输的落点高亮 */
    .sp-row.dragging { opacity: .5; }
    .sp-body.drop-hot { outline: 2px dashed var(--accent); outline-offset: -3px; background: rgba(32,145,246,.06); }

    /* T2 复刻 —— 水平分屏(原版 `Split horizontally`)与广播(原版 `Broadcast`) */
    /* 这条原本写成 `.tab-pane`(0-1-0),把上面那条 `.tab-pane{display:none}` 覆盖掉了 ——
       结果**所有** pane 都显示,非活动视图一直叠在下面:会话屏底部漏出 SFTP 浅色、
       截图看着"慢一帧",都是它引起的。必须只作用于活动 pane。 */
    .tab-pane.active { display: flex; flex-direction: column; }
    .split-pane { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column;
      border-top: 1px solid var(--wire); }
    .split-head { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: var(--bg2);
      font-size: 12px; color: var(--fg-dim); }
    .split-bc { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .split-picker { display: flex; align-items: center; gap: 8px; padding: 10px; }
    .split-picker select { background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 7px; font-size: 12px; }
    .split-body { flex: 1; min-height: 0; }

    /* T6 复刻 —— Known Hosts 多选(原版有 Select All / Clear selection / Multi-Select Context Menu) */
    .kh-row.sel { background: rgba(32,145,246,.18); }
    .kh-selbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-bottom: 1px solid var(--wire); font-size: 12px; color: var(--fg-dim); }
    .kh-selbar:empty { display: none; }

    .tag-chip { display: inline-flex; align-items: center; gap: 3px; }
    .tag-x { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 9px;
      padding: 0 1px; line-height: 1; }
    .tag-x:hover { color: var(--danger); }

    /* T3 复刻 —— 端口转发。入口:侧栏一级导航 Port Forwarding;工具栏 `＋ New forwarding`;
       空态文案与向导四步的标签/说明均逐字取自原版实测(F17)。 */
    /* T1 复刻 —— 外观设置:配色方案 / 字号 / 字体。
       配色数据取自原版自身的 colorSchemesArray(64 套,见 renderer/themes.ts)。
       说明:原版把主题放在终端侧栏的调色板按钮里;我方没有侧栏,故收在终端标题栏的 🎨 里(有意偏离)。 */
    .prefs { position: absolute; right: 12px; top: 40px; z-index: 30; width: 320px; max-height: 70vh;
      background: var(--bg2); border: 1px solid var(--wire); border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .prefs h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; }
    .prefs-row { display: flex; align-items: center; gap: 8px; }
    .scheme-list { max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .scheme { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--fg);
      text-align: left; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .scheme:hover { background: var(--h07); }
    .scheme.on { background: var(--h12); }
    .swatches { display: flex; gap: 1px; }
    .swatches i { width: 9px; height: 14px; display: block; }
    .prefs input[type=number] { width: 62px; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 7px; font-size: 13px; }
    .prefs select { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 6px; font-size: 13px; }

    /* T7 复刻 —— 按标签过滤 + 布局切换(原版 Change layout 提供 List / Grid 两种,文案取自原版) */
    #host-tags, #host-layout { border: 1px solid var(--wire); background: var(--bg); color: var(--fg-dim);
      border-radius: 8px; width: 30px; cursor: pointer; font-size: 12px; }
    #host-tags:hover, #host-layout:hover { color: var(--fg); }
    #host-tags.on { color: var(--accent); border-color: var(--accent); }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 8px 5px 26px; }
    .tag-chip { font-size: 10px; color: var(--fg-dim); background: var(--h06);
      border-radius: 4px; padding: 1px 5px; }
    .tag-menu-item { display: flex; align-items: center; gap: 7px; }
    .tag-menu-item input { margin: 0; }

    /* T7 复刻 —— 主机簿搜索与排序(占位符与排序项取自原版实测,见 F20) */
    #host-tools { display: flex; gap: 6px; padding: 0 10px 8px; }
    #host-search { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; }
    #host-search:focus { border-color: var(--accent); }
    #host-sort { border: 1px solid var(--wire); background: var(--bg); color: var(--fg-dim); border-radius: 8px;
      width: 32px; cursor: pointer; font-size: 13px; }
    #host-sort:hover { color: var(--fg); }
    .sort-menu { position: absolute; z-index: 20; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 9px; padding: 5px; min-width: 168px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .sort-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg);
      font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    .sort-item:hover { background: var(--h08); }
    .sort-item.on { color: var(--accent); }

    #nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
    .nav-item { display: flex; align-items: center; gap: 9px; border: 0; background: transparent;
      color: var(--fg); font-size: 14px; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .nav-item .ni { width: 18px; text-align: center; opacity: .85; }
    .nav-item:hover { background: var(--h07); }
    .nav-item.on { background: var(--h11); }
    .fwd { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .fwd-bar { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 14px; }
    .fwd-new { display: flex; }
    .fwd-new-main { border: 0; background: var(--bg3); color: var(--fg); font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: 9px 0 0 9px; cursor: pointer; }
    .fwd-new-caret { border: 0; border-left: 1px solid var(--wire); background: var(--bg3); color: var(--fg-dim);
      padding: 8px 8px; border-radius: 0 9px 9px 0; cursor: pointer; }
    .fwd-new-main:hover, .fwd-new-caret:hover { background: #2f3946; }
    .fwd-icon { border: 0; background: transparent; color: var(--fg-dim); font-size: 14px; cursor: pointer;
      padding: 6px 8px; border-radius: 7px; }
    .fwd-icon:hover { background: var(--h08); color: var(--fg); }
    .fwd-body { flex: 1; min-height: 0; overflow-y: auto; }
    .fwd-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fwd-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 20px; }
    .fwd-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
    .fwd-empty p { margin: 0; font-size: 14px; color: var(--fg-dim); }
    .fwd-list { display: flex; flex-direction: column; }
    .fwd-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--wire); }
    .fwd-row:hover { background: var(--h04); }
    .fwd-badge { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 700; background: var(--bg3); }
    .fwd-badge.local { background: rgba(32,145,246,.2); color: #6ba0c3; }
    .fwd-badge.remote { background: rgba(236,168,85,.2); color: #fdc47d; }
    .fwd-badge.dynamic { background: rgba(33,181,104,.2); color: #3ed7be; }
    .fwd-main { flex: 1; min-width: 0; }
    .fwd-title { font-size: 14px; }
    .fwd-sub { font-size: 12px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fwd-state { font-size: 12px; color: var(--fg-dim); }
    .fwd-state.running { color: #3ed7be; }
    .fwd-state.error { color: var(--danger); }
    .fwd-wiz-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex;
      align-items: center; justify-content: center; z-index: 45; }
    .fwd-wiz { width: min(620px, 92vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; display: flex; flex-direction: column; max-height: 82vh; }
    .fwd-wiz-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--wire); }
    .fwd-wiz-head .crumb { font-size: 13px; color: var(--fg-dim); }
    .fwd-wiz-body { padding: 18px 20px; overflow-y: auto; }
    .fwd-wiz-body h3 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
    .fwd-hint { margin: 0 0 16px; font-size: 13px; color: var(--fg-dim); line-height: 1.5; }
    .fwd-field { display: block; margin-bottom: 14px; }
    .fwd-field .cap { display: block; font-size: 12px; color: var(--fg-dim); margin-bottom: 5px; }
    .fwd-field input { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none; }
    .fwd-field input:focus { border-color: var(--accent); }
    .fwd-kinds { display: flex; gap: 10px; margin-bottom: 16px; }
    .fwd-kind { flex: 1; display: flex; align-items: center; gap: 9px; background: var(--bg3); border: 1px solid transparent;
      color: var(--fg); border-radius: 10px; padding: 12px; cursor: pointer; font-size: 14px; }
    .fwd-kind .k { width: 24px; height: 24px; border-radius: 7px; background: var(--h10);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .fwd-kind.on { border-color: var(--accent); background: rgba(32,145,246,.14); }
    .fwd-hostmenu { margin-top: 10px; background: var(--bg); border: 1px solid var(--wire); border-radius: 10px; padding: 6px; }
    .fwd-hostgroup { font-size: 12px; color: var(--fg-dim); padding: 6px 8px; }
    .fwd-hostitem { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
      color: var(--fg); text-align: left; padding: 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .fwd-hostitem:hover { background: var(--h08); }
    .fwd-hostitem .hs { color: var(--fg-dim); font-size: 12px; }
    .fwd-wiz-foot { display: flex; align-items: center; padding: 12px 14px; border-top: 1px solid var(--wire); }

    /* T6 复刻 —— 已知主机视图 + 主机密钥询问(文案取自原版,见 renderer/knownhosts.ts 注释) */
    .kh { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .kh-bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; }
    .kh-bar-title { font-size: 14px; font-weight: 500; }
    .kh-hint { font-size: 12px; color: var(--fg-dim); }
    .kh-body { flex: 1; min-height: 0; overflow-y: auto; }
    .kh-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .kh-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 20px; }
    .kh-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
    .kh-empty p { margin: 0; font-size: 14px; color: var(--fg-dim); }
    .kh-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--wire); }
    .kh-row:hover { background: var(--h04); }
    .kh-ico { width: 26px; height: 26px; border-radius: 8px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 13px; }
    .kh-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .kh-host { font-size: 14px; }
    .kh-fp { font-size: 12px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kh-type { font-size: 12px; color: var(--fg-dim); }
    .hk-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
      align-items: center; justify-content: center; z-index: 70; }
    .hk-dialog { width: min(560px, 92vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; padding: 20px; }
    .hk-dialog h3 { margin: 0 0 14px; font-size: 18px; font-weight: 500; }
    .hk-dialog h3.error { color: var(--danger); }
    .hk-body { font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
    .hk-fp { font-family: ui-monospace, Menlo, monospace; word-break: break-all; color: var(--fg); }
    .hk-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* T8 复刻 —— 断线覆盖层与全局断开条(文案取自原版自身,见 F19) */
    .disc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10,12,22,.72); z-index: 8; }
    .disc-card { background: var(--bg2); border: 1px solid var(--wire); border-radius: 12px;
      padding: 18px 20px; min-width: 320px; text-align: center; }
    .disc-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
    .disc-reason { font-size: 13px; color: var(--fg-dim); margin-bottom: 16px; }
    .disc-actions { display: flex; gap: 8px; justify-content: center; }
    #disc-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 40; display: flex;
      align-items: center; gap: 10px; padding: 0 12px; background: #5a2b2b; color: var(--fg); font-size: 13px; }
    #disc-bar .btn { padding: 3px 10px; font-size: 12px; }

    /* host form (modal-ish) */
    #form-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
      align-items: center; justify-content: center; z-index: 10; }
    #form-backdrop.visible { display: flex; }
    #host-form { width: 360px; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 10px; padding: 16px; }
    #host-form h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    #host-form label { display: block; margin: 9px 0 4px; color: var(--fg-dim); font-size: 12px; }
    #host-form input, #host-form select { width: 100%; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 6px; padding: 6px 9px; font-size: 13px; outline: none; }
    #host-form input:focus, #host-form select:focus { border-color: var(--accent); }
    #host-form .row { display: flex; gap: 10px; }
    #host-form .row > div { flex: 1; }
    #form-error { color: var(--danger); min-height: 18px; margin-top: 8px; font-size: 12px; }
    #form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    /* T5 复刻 —— SFTP 双栏(作为 tab,不再是模态框)。
       尺寸/结构照原版实测:栏标题 14px/450、面包屑 14px/450、列头 12px/700、
       行两行式(名 + 权限串 10px)、行距 47、列宽 279/151/101/90(相对栏内缩进 20)、
       栏间 1px 分隔;远端未绑会话时显示 "Connect to host" + "Select host" 空态(18px/500)。
       原版那些颜色测自其浅色 UI,我方是深色 UI,故颜色改用本应用主题变量。 */
    /* ===== SFTP 恒为浅色(原版实测:即使 chrome 是深色,SFTP 也是浅色)=====
       色值全部取自原版 SFTP 屏:列表底 #edf1f2、头部带 #f7f9fa、分隔 #d6dde0、
       主文字 #141728、次文字 #7b8c94、夹图标 #7acef8、按钮 #d6dddf、空态图标块 #141728。 */
    .sftp { position: relative; height: 100%; display: flex; min-height: 0; background: #edf1f2;
      --bg: #edf1f2; --bg2: #f7f9fa; --bg3: #141728; --fg: #141728; --fg-dim: #7b8c94;
      --wire: #d6dde0; --accent: #7acef8; --fg-strong: #141728;
      --h05: rgba(20,23,40,.045); --h08: rgba(20,23,40,.075); --h12: rgba(20,23,40,.11);
      color: #141728; }
    .sftp-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--wire); }
    .sftp-pane:last-of-type { border-right: 0; }
    .sp-head { display: flex; align-items: center; gap: 9px; height: 50px; padding: 0 12px 0 20px;
      background: #f7f9fa; border-bottom: 0; }
    /* 原版栏头文字是 Local / Remote(不是全大写) */
    .sp-head .sp-title { text-transform: none; font-size: 14px; font-weight: 500; }
    /* 空态按钮:原版是浅灰底 #d6dddf + 深色文字(我覆写 --bg3 后曾变成深底深字,文字看不见) */
    .sftp .sp-select { background: #d6dddf; color: #141728; border: 0; }
    .sftp .sp-select:hover { background: #c9d2d5; }
    .sp-pico { display: flex; color: #141728; }
    .sp-btn { color: #141728; }
    .sp-head .sp-title { font-size: 14px; font-weight: 450; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-btn { border: 0; background: transparent; color: var(--fg); font-size: 14px; font-weight: 450;
      cursor: pointer; padding: 5px 8px; border-radius: 7px; white-space: nowrap; }
    .sp-btn:hover { background: var(--h08); }
    .sp-filter { padding: 0 20px 8px; }
    .sp-filter input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 9px; font-size: 13px; outline: none; }
    .sp-crumbs { display: flex; align-items: center; gap: 2px; height: 50px; padding: 0 12px 0 16px; overflow: hidden; background: #f7f9fa; }
    .sp-arrow { border: 0; background: transparent; color: var(--fg); font-size: 15px; cursor: pointer;
      border-radius: 6px; padding: 2px 7px; }
    .sp-arrow:hover { background: var(--h08); }
    .sp-crumbs .seg { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 450;
      padding: 3px 7px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    .sp-crumbs .seg:hover { background: var(--h08); }
    .sp-crumbs .seg-ico { width: 14px; height: 12px; border-radius: 3px; background: var(--accent); opacity: .85; }
    .sp-cols { display: flex; align-items: center; height: 34px; padding: 0 8px 0 20px;
      font-size: 12px; font-weight: 700; border-top: 1px solid var(--wire); border-bottom: 1px solid var(--wire); }
    /* 窄宽度(两栏 + 侧栏同时开时)会让固定列把名称列挤到 0,出现"表头 Name 变 Na、行内文字互相压字"。
       改成:名称列有下限并可省略,其余列可收缩但有下限。 */
    .sp-cname, .sp-name { flex: 1 1 auto; min-width: 90px; overflow: hidden; }
    .sp-cname > span, .sp-cdate, .sp-csize, .sp-ckind { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-cdate { flex: 0 1 151px; min-width: 60px; } .sp-csize { flex: 0 1 101px; min-width: 46px; }
    .sp-ckind { flex: 0 1 90px; min-width: 44px; }
    .sp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .sp-rows { flex: 1; overflow-y: auto; }
    .sp-row { display: flex; align-items: center; height: 44px; padding: 0 8px 0 20px; cursor: default; }
    /* 列表标题行:原版是"无底色、只有列间细竖线 + 底部一条线",Name 左对齐、其余居中、字重 600。
       我这边 .sp-col 是 <button>,只改了颜色没清掉 UA 默认的底色/边框,于是成了一排灰底方框(用户截图)。 */
    .sp-cols { border-bottom: 1px solid #d6dde0; }
    .sp-col { background: transparent; border: 0; border-right: 1px solid #d6dde0;
      color: #141728; font-size: 13.5px; font-weight: 600; height: 100%;
      padding: 0 12px; text-align: center; }
    .sp-col.sp-cname { text-align: left; padding-left: 20px; }
    .sp-col:last-child { border-right: 0; }
    .sp-col:hover { background: rgba(20,23,40,.035); }
    .sp-row:hover { background: var(--h05); }
    .sp-row.sel { background: rgba(32,145,246,.18); }
    .sp-row.up { cursor: pointer; }
    .sp-row.up .nm { font-weight: 600; }
    /* 注意:这条必须自带 min-width —— 早前那条 min-width:0 会让名称列在窄栏里塌成 24px(只剩图标,名字不可见)。 */
    .sp-name { flex: 1 1 auto; min-width: 90px; overflow: hidden; display: flex; align-items: center; gap: 9px; }
    .sp-ico { width: 18px; height: 18px; border-radius: 4px; flex: none; }
    .sp-ico.dir { background: #8ab4f8; } .sp-ico.file { background: #7f8c99; }
    .sp-label { min-width: 0; display: flex; flex-direction: column; }
    .sp-label .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-label .pm { font-size: 10px; font-weight: 450; color: var(--fg-dim); }
    .sp-date { flex: 0 1 151px; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .sp-size { flex: 0 1 101px; min-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .sp-kind { width: 90px; font-size: 13px; color: var(--fg-dim); }
    .sftp-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .sp-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 22px; }
    .sftp-empty h3 { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
    .sftp-empty p { margin: 0 0 18px; font-size: 14px; color: var(--fg-dim); line-height: 1.5; text-align: center; }
    .sp-select { background: var(--bg3); color: var(--fg); border: 0; border-radius: 8px;
      padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .sp-select:hover { background: #2f3946; }
    .sp-menu { position: fixed; z-index: 30; min-width: 148px; background: var(--bg2);
      border: 1px solid var(--wire); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; }
    .sp-menu-title { padding: 6px 10px 4px; font-size: 12px; color: var(--fg-dim); }
    .sp-menu-item { border: 0; background: transparent; color: var(--fg); text-align: left;
      padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .sp-menu-item:hover { background: var(--h09); }
    .sp-menu-item.danger { color: var(--danger); }
    .sftp-queue { position: absolute; right: 14px; bottom: 14px; width: 340px;
      display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
    .job { display: flex; align-items: center; gap: 8px; font-size: 12px; background: var(--bg2);
      border: 1px solid var(--wire); border-radius: 7px; padding: 5px 8px; }
    .job .jname { flex: 0 0 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job .jbar { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .job .jfill { height: 100%; background: var(--accent); width: 0%; }
    .job.done .jfill { background: #a3be8c; width: 100%; }
    .job.err .jfill { background: var(--danger); }
    .job .jstat { width: 88px; text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .job.err .jstat { color: var(--danger); }
  
    /* ---- 分屏布局修正(放在样式表末尾,确保压过前面的规则)----
       前面有 `.tab-pane.active{display:block}`(0-2-0)与 `.tab-pane .term-host{height:100%}`(0-2-0),
       低特异度规则会被压过 —— 实测表现为:分屏后主终端仍是 block + height:100%,把分屏顶出视口(y=-339),
       页面还被撑出滚动(scrollY=439)。这里用同/更高特异度覆盖。 */
    body, #app { overflow: hidden; }
    .tab-pane.active { display: flex; flex-direction: column; }
    .tab-pane.active .term-host { flex: 1 1 50%; min-height: 0; height: auto; overflow: hidden; }
    .tab-pane.active .split-pane { flex: 1 1 50%; min-height: 0; }

    /* T2 复刻 —— 工作区视图(原版 tabVariant: workspaceVerticalTab / active-workspace-tab /
       toggleWorkspaceViewMode):tab 不再横向排在上方,而是竖排在终端左侧。 */
    #main-body { flex: 1 1 auto; min-height: 0; display: flex; }
    #main-body > #stage { flex: 1 1 auto; min-width: 0; min-height: 0; }
    #ws-rail { display: none; }
    body[data-tabview="workspace"] #tabstrip { display: none; }
    body[data-tabview="workspace"] #ws-rail { display: flex; flex-direction: column; width: 190px;
      flex: 0 0 190px; overflow-y: auto; border-right: 1px solid var(--wire); background: var(--bg2); }
    .ws-row { display: flex; align-items: center; gap: 7px; padding: 7px 9px; cursor: pointer;
      font-size: 12px; color: var(--fg-dim); border-bottom: 1px solid var(--wire); }
    .ws-row:hover { background: var(--h04); }
    .ws-row.active { background: rgba(32,145,246,.16); color: var(--fg); }
    .ws-row .ws-lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-row .ws-x { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; }
    .ws-row .ws-x:hover { color: var(--danger); }
    .ws-empty { padding: 10px; font-size: 12px; color: var(--fg-dim); }

    /* T4 复刻 —— 终端侧栏(原版 `Show terminal side-panel` / 动作 toggleSidepanel,
       内容含 Snippets / Serial / Jump to;具体文案与布局未取到,视觉为自设计) */
    #sidepanel { display: none; }
    body[data-panel="1"] #sidepanel { display: flex; flex-direction: column; width: 250px;
      flex: 0 0 250px; border-left: 1px solid var(--wire); background: var(--bg2); overflow-y: auto; }
    .sp-head { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 12px;
      color: var(--fg-dim); border-bottom: 1px solid var(--wire); }
    .sp-sec { padding: 8px 10px; border-bottom: 1px solid var(--wire); }
    .sp-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-dim);
      margin-bottom: 6px; }
    .sp-list { display: flex; flex-direction: column; gap: 2px; }
    .sp-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px;
      font-size: 12px; cursor: pointer; }
    .sp-item:hover { background: var(--h05); }
    .sp-item .sp-nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-item .sp-sub { color: var(--fg-dim); font-size: 11px; }
    .sp-del { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; }
    .sp-del:hover { color: var(--danger); }
    .snip-add { display: flex; gap: 4px; margin-top: 6px; }
    .snip-add input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 6px; padding: 4px 6px; font-size: 11px; }

    /* T8 复刻 —— 重连日志(原版 `Attempting reconnection to server with ID …`) */
    .disc-log { margin-top: 10px; text-align: left; max-width: 420px; }
    .disc-log-line { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-dim);
      opacity: .9; padding: 1px 0; }

    /* T5/T1 复刻 —— 浅色界面主题。
       诚实标注:原版**界面**浅色调色板未取到(ui-process 的 JS/CSS 里都没有可读的调色板定义,
       不像终端配色那样有 colorSchemesArray),所以下面这套浅色值是**自设计**的,
       只保证结构一致(同一组语义变量 + 硬编码覆盖层全部变量化)。 */
    body[data-ui="light"] {
      --bg: #f4f6f8; --bg2: #ffffff; --bg3: #eceff3;
      --fg: #1f2430; --fg-dim: #6b7280; --wire: #dde2e8;
      --accent: #2f6f8f; --danger: #c0392b; --fg-strong: #1f2430;
      --h04: rgba(0,0,0,.04);
      --h05: rgba(0,0,0,.05);
      --h06: rgba(0,0,0,.06);
      --h07: rgba(0,0,0,.07);
      --h08: rgba(0,0,0,.08);
      --h09: rgba(0,0,0,.09);
      --h10: rgba(0,0,0,.1);
      --h11: rgba(0,0,0,.11);
      --h12: rgba(0,0,0,.12);
    }

    /* T7 复刻 —— 标签颜色(自设计:原版数据形态取不到)与色点 */
    .tag-chip { border: 1px solid transparent; }
    .tag-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--wire);
      padding: 0; cursor: pointer; flex: none; }
    .tag-dot:hover { transform: scale(1.25); }
    .tag-pal { display: flex; align-items: center; gap: 4px; padding: 4px 2px; width: 100%; }
    .tag-sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--wire); cursor: pointer; }
    .tag-sw.on { outline: 2px solid var(--fg); outline-offset: 1px; }
    .tag-sw.clear { background: transparent; color: var(--fg-dim); font-size: 9px; line-height: 1; }

    /* 快捷键跳转到侧栏分区时的一次性高亮 */
    .sp-sec.sp-flash { background: rgba(32,145,246,.14); transition: background .25s; }

    /* ============ 2026-10-18 对齐原版的布局与配色(几何均由截图逐像素量得)============
       顶栏 49px 通栏(红绿灯占左端 78px);导航栏 184px;导航项高 36、间距 8;
       工具条按钮高 30;搜索框高 36 通栏、右端内嵌 Connect;主机卡片 350×60、图标块 40×40。 */
    #app { flex-direction: column; }
    #topbar { display: flex; align-items: center; gap: 6px; height: 49px; flex: none;
      padding: 0 10px 0 var(--tl-inset); background: var(--bg3); -webkit-app-region: drag; }
    #topbar button, #topbar .tab-btn { -webkit-app-region: no-drag; }
    .top-icon { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer;
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .top-icon:hover { background: rgba(255,255,255,.07); color: var(--fg); }
    #shell { display: flex; flex: 1; min-height: 0; }
    #rail { width: 185px; flex: none; background: var(--bg2); padding: 12px 10px;
      display: flex; flex-direction: column; gap: 8px; }
    .rail-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
      border: 0; border-radius: 9px; background: transparent; color: var(--fg);
      font-size: 13.5px; text-align: left; cursor: pointer; flex: none; }
    /* 更正:原版导航图标是**白色**(与文字同色),不是灰的 ——
       之前记的 #6E7281 是原版调色数组里的三级文字色,被我误当成图标色。 */
    .rail-item .ri { display: flex; color: var(--fg); }
    .rail-item:hover { background: rgba(255,255,255,.05); }
    .rail-item.on { background: var(--panel); }
    .rail-item.on .ri { color: var(--fg); }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    /* tab 为 pill,带 kind 图标 */
    #tabs { gap: 4px; }
    .tab-btn { border-radius: 8px; background: #3b3e4a; color: var(--fg); height: 28px; }
    .tab-btn.active { background: var(--panel); color: var(--fg); }
    .tab-btn.session.active { background: var(--panel); color: var(--fg); }
    .tab-btn .tico { display: flex; color: var(--icon-dim); }
    .tab-btn.active .tico { color: var(--fg); }
    #btn-new-tab { height: 28px; width: 28px; border-radius: 8px; color: var(--fg); }
    /* --- Vaults(Hosts 分区)--- */
    /* 注意:.sec.vault 同时带 sec 与 vault 两个类,这条早期规则的内边距会把整屏再压下去 10px
       (基准点 59/114/168/205 全部偏下)。内边距统一由 .sec-band 负责,这里必须为 0。 */
    .vault { display: flex; flex-direction: column; height: 100%; min-height: 0; padding: 0; }
    /* margin-top 11:搜索带(#host-tools)自身有 8px 下内边距,19 会让按钮行整体下移 8px;
       11 + 8 = 19,才等于原版实测的"搜索框底 94 → 按钮顶 114" 的 20px 视觉间距。 */
    #host-toolbar { display: flex; align-items: center; gap: 6px; height: 30px; margin-top: 11px; }
    .tb-btn { height: 30px; border: 0; border-radius: 8px; background: var(--btn2); color: var(--fg);
      font-size: 13px; padding: 0 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .tb-btn.caret { padding: 0 7px; }
    .tb-btn:hover { background: #474b5b; }
    .tb-icon { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent;
      color: var(--fg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tb-icon:hover { background: rgba(255,255,255,.07); }
      display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
    #host-tools { display: flex; align-items: center; gap: 8px; height: 36px;
      background: var(--panel); border-radius: 9px; padding: 0 6px 0 12px; }
    /* 原版实测:输入框有自己的填充色 #3e4356(比面板底 #282c3c 亮一档),而不是透明的 —— 
       透明会让整条带子糊成一片,看不出哪里能输入。圆角 8px、内边距 0 10px。 */
    /* 显式 34px:height:100% 在 flex 行里没解析成 36(实测只有 15px,输入框被压成一条);
       34px 取自原版实测(搜索框 59..93)。 */
    #host-tools #host-search { flex: 1; min-width: 0; background: #3e4356; border: 0; outline: none;
      color: var(--fg); font-size: 13px; height: 36px; border-radius: 8px; padding: 0 10px; }
    #host-tools #host-search::placeholder { color: var(--fg-dim); }
    #host-tools #btn-connect { height: 26px; border: 0; border-radius: 7px; background: transparent;
      color: var(--disabled); font-size: 13px; padding: 0 10px; cursor: default; }
    /* 组头 = 原版的分区标题(白色 13.5px,首字母大写) */
    /* 组头盒高必须正好 15px:旧规则带的 padding(10/3)会让它变 28px,把下面的卡片整体推低 */
    #host-list .group-label { color: var(--fg); font-size: 13.5px; font-weight: 500; line-height: 15px;
      padding: 0; text-transform: none; margin: 19px 0 13px; letter-spacing: 0; }
    #host-list .group-label::first-letter { text-transform: uppercase; }
    .sec-h { color: var(--fg); font-size: 13.5px; font-weight: 500; margin: 20px 0 12px; }
    #host-list { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; display: flex;
      flex-direction: column; gap: 8px; padding-bottom: 12px; }
    /* 网格布局 = **同一张卡片**按自适应列数排布,卡片内部一律沿用列表态的样式。
       (此前这里是两条互相打架的规则:一条把卡片内部改成竖排堆叠、另一条只改列宽,
        于是图标/名称/操作/标签全竖着挤在一列里、标签还溢出卡片 —— 用户截图里的"坏了"。) */
    #host-list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px 12px; align-content: start; }
    #host-list.grid .group-label { grid-column: 1 / -1; }
    #host-list.grid .host-item { width: auto; min-width: 0; }
    /* 主机卡片:350×60,图标块 40×40 青绿(#35d39a 实测),主名白色、副标题 #8d92a5 */
    #host-list .host-item { min-width: 350px; max-width: 460px; width: fit-content; min-height: 60px;
      border-radius: 10px; background: var(--bg2); padding: 10px 12px;
      display: flex; align-items: center; gap: 12px; }
    #host-list .host-item:hover { background: #2e3247; }
    #host-list .host-item .hico { width: 40px; height: 40px; border-radius: 10px; background: #35d39a;
      flex: none; display: flex; align-items: center; justify-content: center; color: #0f2a20; }
    #host-list .host-item .hcol { flex: 1; min-width: 0; }
    #host-list .host-item .name { color: var(--fg); font-size: 13.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    #host-list .host-item .sub { color: var(--fg-dim); font-size: 12px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #host-list .host-item .tag-chips { flex: none; max-width: 150px; flex-wrap: wrap;
      justify-content: flex-end; opacity: 0; transition: opacity .12s; }
    #host-list .host-item:hover .tag-chips { opacity: 1; }
    #host-list .host-item .tag-chip { font-size: 10.5px; }
    #host-list .host-item [data-act] { opacity: 0; }
    #host-list .host-item:hover [data-act] { opacity: 1; }

    /* 分区列表(Snippets / Keychain / Logs 共用) */
    .sec-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; }
    .sec-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
      border-radius: 9px; background: var(--bg2); font-size: 13px; }
    .sec-row .nm { color: var(--fg); min-width: 140px; }
    .sec-row .cm { color: var(--fg-dim); font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sec-row .at { color: var(--fg-dim); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .sec-row .tx { color: var(--fg); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sec-row.log.warn .tx { color: #ffd479; } .sec-row.log.error .tx { color: var(--danger); }
    .sec-empty { color: var(--fg-dim); font-size: 13px; padding: 10px 2px; }
    .pill { font-size: 11.5px; color: var(--fg-dim); background: rgba(255,255,255,.06);
      border-radius: 999px; padding: 3px 9px; }
    .pill.on { color: #0f2a20; background: #35d39a; }
    #host-list .host-item .hcol { display: flex; flex-direction: column; min-width: 0; }

      display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 2px; }
    #host-list { padding-left: 22px; }
    #host-list .group-label { padding-left: 0; }
    .tb-btn svg { flex: none; }

    .tchev { display: flex; align-items: center; color: var(--fg-dim); margin-left: -2px; padding: 0 2px; }
    .tchev:hover { color: var(--fg); }

    /* 原版顶栏上的 pill 平时不显示关闭键(悬停/激活时才出现),避免一眼看去全是 ✕ */
    .tab-close { opacity: 0; transition: opacity .12s; }
    .tab-btn:hover .tab-close, .tab-btn.active .tab-close { opacity: .55; }
    .tab-btn .tab-close:hover { opacity: 1; }

    .menu-sep { height: 1px; background: var(--wire); margin: 6px 0; }
    .menu-cap { font-size: 11px; color: var(--fg-dim); padding: 4px 10px; }

    /* ===== 会话屏结构(按原版实测:终端占满全宽、无左栏、无会话头行)=====
       证据:原版会话态截图 y=400 处 x=0..1279 全是终端底色 #141728;
       顶栏底色在会话态是终端底色(我上一轮把这条真结论误"更正"掉了,现恢复)。 */
    body[data-chrome="session"] #rail, body[data-chrome="sftp"] #rail { display: none; }
    body[data-chrome="session"] #topbar { background: var(--term-bg); }
    #term-head { display: none !important; }
    /* 会话 tab:连接中为绿调(原版实测 #1d3536 ≈ 终端底 + 14% 绿),图标与关闭键同绿 */
    /* 连接态本身不染色:绿色是"当前活动会话"的标志(原版非活动会话 pill 就是普通深色)。
       断开的会话保留一圈很淡的红,作为我方提示(原版未见对应状态)。 */
    .tab-btn.session.off:not(.active) { box-shadow: inset 0 0 0 1px rgba(255,115,117,.35); }
    .tab-btn.session.on.active .tico, .tab-btn.session.on.active .tab-close { color: #42b16e; }
    .tab-btn.session.on.active .tab-close:hover { color: #6fd3a4; }

    /* 原版"放弃修改"确认框(几何实测:498 宽、垂直居中、头 36px 深色、白底、按钮右下) */
    .discard-dlg { position: fixed; inset: 0; background: rgba(20,23,40,.45); display: flex;
      align-items: center; justify-content: center; z-index: 60; }
    .dd-box { width: 498px; border-radius: 6px; overflow: hidden; background: #ffffff;
      box-shadow: 0 18px 48px rgba(0,0,0,.35); }
    .dd-head { height: 36px; background: var(--bg2); color: #fff; display: flex; align-items: center;
      padding: 0 10px 0 24px; font-size: 14px; }
    .dd-head span { flex: 1; }
    .dd-x { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 13px; }
    /* 原版正文区高 192(总高 228 = 头 36 + 正文 192):用 min-height + space-between 固定,
       不依赖文案是否折行。 */
    .dd-body { padding: 26px 24px 30px; color: #141728; min-height: 192px; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: space-between; }
    .dd-body p { margin: 0; font-size: 13.5px; line-height: 1.45; }
    .dd-ok { align-self: flex-end; height: 32px; border: 0; border-radius: 6px; background: var(--danger);
      color: #fff; font-size: 13.5px; padding: 0 14px; cursor: pointer; }
    .dd-ok:hover { filter: brightness(1.06); }

    /* ===== 分区屏(按原版实测):工具条带 单行 56px / Vaults 两行 100px,底色 #282b3d ===== */
    .sec { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--bg); }
    .sec-band { background: var(--bg2); padding: 19px 10px 7px; display: flex; align-items: center; gap: 6px; }
    .sec.vault .sec-band { display: block; padding: 8px 10px 7px; }
    .sec.vault .sec-band #host-toolbar { margin-top: 11px; }
    .sec-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px; }
    .sec-chip { height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--fg);
      font-size: 13px; padding: 0 10px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
    .sec-chip:hover { background: rgba(255,255,255,.07); }
    .tb-caret { display: flex; margin-left: 4px; opacity: .85; }
    /* 空态:描边圆角块 60×60 + 15px 白标题 + 13px 灰说明,居中(原版实测:块是描边不是实底) */
    .sec-empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding-bottom: 40px; }
    .sec-empty-ico { width: 60px; height: 60px; border-radius: 14px; border: 1px solid #4e5264;
      display: flex; align-items: center; justify-content: center; color: var(--fg); }
    .sec-empty-title { margin-top: 32px; font-size: 15px; font-weight: 600; color: var(--fg); }
    .sec-empty-desc { margin-top: 10px; font-size: 13px; color: var(--fg-dim); text-align: center; }
    .sec-list.is-empty { padding: 0; }
    .sec-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; }
    .sec-row .hico { width: 40px; height: 40px; border-radius: 10px; flex: none;
      display: flex; align-items: center; justify-content: center; }
    .sec-row .hico.blue { background: #08639f; }
    .sec-row { min-height: 56px; }

    /* Known Hosts 行 = 原版卡片形态(350 宽、蓝图标块、单行名称、无副标题) */
    .kh-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
    .kh-list .kh-row { width: 350px; min-height: 56px; border-radius: 10px; background: var(--bg2);
      padding: 0 12px; display: flex; align-items: center; gap: 12px; }
    .kh-list .kh-row:hover { background: #2e3247; }
    .kh-list .kh-row .kh-ico { width: 40px; height: 40px; border-radius: 10px; background: #08639f;
      display: flex; align-items: center; justify-content: center; flex: none; font-size: 0; }
    .kh-list .kh-row .kh-name { color: var(--fg); font-size: 13.5px; }
    .kh-list .kh-row .kh-src { color: var(--fg-dim); font-size: 12px; }
    .sec-body .kh { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .sec-body .kh .kh-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }

    /* 分组头全局改回标题式(我此前的规则被限制在 #host-list 内,Known Hosts 屏仍是大写) */
    .group-label { text-transform: none; color: var(--fg); font-size: 13.5px; font-weight: 500;
      line-height: 15px; padding: 0; margin: 23px 0 13px; letter-spacing: 0; }
    .group-label::first-letter { text-transform: uppercase; }
    .kh-list .kh-row .kh-main { flex: 1; min-width: 0; }
    .kh-list .kh-row .kh-main span:first-child { color: var(--fg); font-size: 13.5px; }
    .kh-list .kh-row .kh-del { opacity: 0; }
    .kh-list .kh-row:hover .kh-del { opacity: 1; }

    /* #banner 没有内容时不该占高度(它此前把整屏往下压了 8-10px,导致 59/114/168/205 全部偏下) */
    #banner:empty { display: none; }
    /* 工具条带按原版实测高度收口:Vaults 两行 = 100px(10 + 搜索 36 + 20 + 工具条 30 + 4) */
    /* 带子底部 8px:实测原版按钮底 143 → 带底 151 = 8px,我们原来只有 4px,
       视觉上按钮像"贴"在带子边缘上(用户指出"新建主机那个大按钮的下间距不对")。 */
    .sec.vault .sec-band { padding: 10px 10px 8px; }
    .group-label { margin: 19px 0 13px; }

    /* 原版:终端**底色铺满**,但文字有水平内缩(实测首字符左起 x=12,纵向不缩:两边首行文字顶都是 y=52)。
       内缩必须加在 .xterm 上 —— FitAddon 会把 .xterm 的 padding 计入可用宽高,
       加在 .term-host 上则不会(它只看 .xterm 的 padding)。 */
    .term-host .xterm { padding: 0 12px; }
    .split-body .xterm { padding: 0 12px; }

    /* .xterm 自带黑色背景(xterm 默认样式),平时被画布盖住;加了内缩后会在内缩处露出黑边,
       必须让它透明,由 .term-host 的终端底色铺满。 */
    .term-host .xterm, .split-body .xterm { background-color: transparent; }
    /* 还有一层:.xterm-viewport 占满整宽且自带黑底,位于画布之后,内缩处露的就是它。 */
    .term-host .xterm-viewport, .split-body .xterm-viewport { background-color: transparent !important; }

    /* ===== 滚动条(原版终端右侧静止时看不到 —— 它是叠加式)=====
       我这边原来吃的是 Chromium 默认浅色滚动条,在深色终端右侧是一条白边(#fafafa,10px)。
       改法:轨道永远透明、滑块静止时透明,悬停该区域时才显一根细的;浅色的 SFTP 里用深一点的滑块。 */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-corner { background: transparent; }
    *::-webkit-scrollbar-thumb { background: transparent; border-radius: 5px; }
    *:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); }
    .sftp *:hover::-webkit-scrollbar-thumb { background: rgba(20,23,40,.28); }

    /* ===== 卡片内宽度分配(修"名字被标签挤掉")=====
       卡片是 nowrap flex:图标 40 + 名称列(flex:1) + 编辑/删除 58 + 标签芯片(实占宽) + 间隙/内边距。
       标签多的主机(如 node-1 有 prod+db)芯片可占 141px,把名称列压到 29px →
       `no…` 截断、副标题 `ssh, root` 折成两行(用户截图里就是这个)。
       修法:给名称列留最小宽度,芯片限宽并允许换行(超出裁掉),互不侵占。 */
    /* 预算(网格列 341、内边距 24 → 317 可用):图标 40 + 名称 ≥96 + 按钮 58 + 芯片 ≤88 + 间隙 4×8
       = 314 ≤ 317 ✓。之前芯片给 118 且间隙 12,总和 360 —— 芯片被挤出卡片右缘 31px(实测)。 */
    #host-list .host-item { gap: 8px; }
    #host-list .host-item .hcol { min-width: 96px; flex: 1 1 auto; }
    /* 单行不换行:首枚标签 + `+N`;不再出现被裁掉一半的芯片。
       宽度预算同上(标签区约 108px)。 */
    #host-list .host-item .tag-chips { flex: 0 1 auto; min-width: 0; max-width: 108px;
      flex-wrap: nowrap; overflow: hidden; }
    #host-list .host-item .tag-chip { flex: none; }
    #host-list .host-item .tag-chip.tag-more { background: var(--h12); border-color: transparent;
      color: var(--fg-dim); padding: 1px 6px; }

    /* ===== 会话 tab 内部结构(按原版实测)=====
       活动 pill 259..498:[✕ 269..278][标签 290..349]………[会话徽标 469..488];标签/✕ = #42b16e,徽标暗一档 #2c674c。
       非活动 pill = [主机头像][标签]。✕ 在左槽:静止显头像,悬停或活动换成 ✕;徽标只在活动时出现。
       常驻 tab(Vaults/SFTP)没有 ✕。 */
    .tab-btn.session { min-width: 150px; padding-left: 10px; padding-right: 10px; }
    /* ✕ 的绿色只属于"当前活动会话":非活动 tab 上应该是跟随文字的浅色。
       实测原版 ✕ 约 19px 宽、笔画较粗;我这边原来只有 10px 且无条件绿,看起来又小又别扭。 */
    .tab-btn.session .tab-close { display: none; opacity: 1; color: inherit; font-size: 15px;
      font-weight: 500; width: 22px; height: 22px; padding: 0; align-items: center;
      justify-content: center; border-radius: 6px; }
    .tab-btn.session .tab-close:hover { background: transparent; color: var(--fg); }
    .tab-btn.session:hover .tab-close, .tab-btn.session.active .tab-close { display: flex; }
    .tab-btn.session:hover .tico, .tab-btn.session.active .tico { display: none; }
    .tab-btn.session .tbadge { display: none; }
    .tab-btn.session.active .tbadge { display: flex; margin-left: auto; color: #2c674c; }
    .tab-btn.session.active .tbadge svg { width: 18px; height: 18px; }   /* 原版徽标 19px 宽 */
    .tab-btn.session.on.active .lbl { color: #42b16e; }
    .tab-btn:not(.session) .tab-close { color: inherit; }

    /* 原版会话 tab 的宽度与头像:非活动 pill 约 181px、活动约 239px;
       左槽是约 24px 的圆角方块"主机头像"(与主机卡片同一枚图标)。 */
    .tab-btn.session { min-width: 180px; }
    .tab-btn.session .lbl { min-width: 120px; }
    .tab-btn.session .tico.tav { width: 24px; height: 24px; border-radius: 6px; background: #35d39a;
      color: #10321f; align-items: center; justify-content: center; flex: none; }
    .tab-btn.session .tico.tav svg { width: 15px; height: 15px; }

    /* 卡片上的编辑/删除按钮按原版做成中性(浅底 + 浅字形),不再用红框 —— 用户截图里原版就没有红。
       悬停删除键时才转成危险色。 */
    #host-list .host-item .btn { border-color: transparent; background: var(--h08); color: var(--fg); }
    #host-list .host-item .btn:hover { background: var(--h12); }
    #host-list .host-item .btn.danger { color: var(--fg); }   /* 字形也是浅色(原版如此),红只在悬停时 */
    #host-list .host-item .btn.danger:hover { color: var(--danger); }

    /* SFTP 两栏头部:原版是 24×24 的实心圆角徽标(白字形)+ 深色标题,两者中心对齐。
       我这边原来是 15px 细线图标、且标题行高 19.6 导致文字比图标高 3px(用户指出"不整齐")。 */
    .sftp .sp-head { align-items: center; }
    .sftp .sp-pico { width: 24px; height: 24px; border-radius: 6px; background: #084976; color: #fff;
      display: flex; align-items: center; justify-content: center; flex: none; }
    .sftp .sp-pico svg { width: 14px; height: 14px; }
    .sftp .sp-pico svg [stroke] { stroke: currentColor; }
    /* 标题行高与徽标同高 → 中心必然一致,不再出现"图标与文字错半格" */
    /* margin 必须清零:某处给 .sp-title 留了 6px 下外边距,居中对齐的 flex 行里
       这会把它整体上推 3px —— 就是"图标与文字不整齐"的真因。 */
    .sftp .sp-title { line-height: 24px; font-size: 14px; margin: 0; font-weight: 500;
      color: #141728; }   /* 颜色也要显式给:某处的 .sp-title{color:var(--fg-dim)} 会漏进来,文字发灰 */
    .sftp .sp-head { padding: 7px 10px; }
    /* ---- 原版对齐补丁(放样式表最后,规避前面重复定义互相覆盖)---- */
    /* 定位祖先必须是它自己:给 #host-tools 显式 position:relative,
       否则 .btn-connect 的 absolute 会相对更外层容器定位(实测跑到 x=1350,窗口外)。 */
    #host-tools { background: transparent; position: relative; }                     /* 带子本身不画底,靠输入框自己的 #3e4356 区分 */
    #host-toolbar .tb-icon { background: transparent; }          /* 右侧是纯图标,hover 才出浅底 */
    #host-toolbar .tb-icon:hover { background: rgba(255,255,255,.06); }
    /* "连接"按钮在原版里是嵌在搜索框**内部**右侧的(框 194..1189,Connect 靠右内嵌)。
       做法:让搜索带做定位容器,按钮绝对定位到右端,输入框右侧留出按钮宽度。 */
    #host-tools { position: relative; }
    #host-tools #host-search { padding-right: 96px; }
    /* right 要算上带子的 10px 内边距,否则按钮右缘会探出输入框(实测 1264 > 1260) */
    /* 原版结构:输入框(浅 #3e4356)+ 右侧**独立的深色连接区**(#323749,实测 1189..1272),
       而不是把"连接"压在输入框填充上。整条规则一次写全,避免后面的 background:transparent 覆盖。 */
    #host-tools #btn-connect { position: absolute; right: 10px; top: 0;   /* 不用 top:50%:#host-tools 有 8px 下内边距,会低 4px */
      height: 36px; padding: 0 14px; border: 0; border-radius: 0 8px 8px 0;
      background: #323749; color: var(--disabled); font-size: 13px; cursor: default; }

  </style>
</head>
<body>
  <div id="app">
    <!-- 顶栏:通栏 49px。原版没有原生标题栏,红绿灯浮在左端,整条顶栏都是 tab 区。 -->
    <header id="topbar">
      <div id="tabs"></div>
      <button id="btn-new-tab" title="New Tab (⌘T)" data-i18n-title="top.newTab">＋</button>
      <span style="flex:1"></span>
      <button id="btn-panel-top" class="top-icon" title="Terminal side-panel (⌘.)" data-i18n-title="top.panel">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg>
      </button>
      <button id="btn-bell" class="top-icon" title="Notifications" data-i18n-title="top.notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M18 15v-4a6 6 0 1 0-12 0v4l-1.6 3h15.2L18 15Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>
      </button>
    </header>
    <div id="shell">
      <!-- 左侧导航栏:184px,原版 6 项(文案取自原版自身字面量),单色图标 + 活动项药丸 -->
      <nav id="rail">
        <button class="rail-item on" data-nav="hosts"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="6.5" rx="2"/><rect x="2.5" y="13" width="19" height="6.5" rx="2"/><rect x="5.8" y="6.9" width="3.4" height="1.8" rx="0.6" fill="currentColor" stroke="none"/><circle cx="17.3" cy="7.8" r="1.05" fill="currentColor" stroke="none"/><rect x="5.8" y="15.4" width="3.4" height="1.8" rx="0.6" fill="currentColor" stroke="none"/><circle cx="17.3" cy="16.3" r="1.05" fill="currentColor" stroke="none"/></svg></span><span class="rl" data-i18n="rail.hosts">Hosts</span></button>
        <button class="rail-item" data-nav="keychain"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="6.8" r="4.2"/><circle cx="12" cy="6.8" r="1.3"/><path d="M12 11v9M12 16.4h3.3M12 18.6h2.4"/></svg></span><span class="rl" data-i18n="rail.keychain">Keychain</span></button>
        <button class="rail-item" data-nav="forwarding"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 15.6h9.6l-3.1-3.1M20 8.4h-9.6l3.1 3.1"/></svg></span><span class="rl" data-i18n="rail.forwarding">Port Forwarding</span></button>
        <button class="rail-item" data-nav="snippets"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 4c-2 0-2 3-2 4s0 3-2 4c2 1 2 3 2 4s0 4 2 4M15 4c2 0 2 3 2 4s0 3 2 4c-2 1-2 3-2 4s0 4-2 4"/></svg></span><span class="rl" data-i18n="rail.snippets">Snippets</span></button>
        <button class="rail-item" data-nav="knownhosts"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3.6c-4.1 0-7.4 3.2-7.4 7.2v2.6"/><path d="M12 6.6c-2.4 0-4.4 2-4.4 4.4v3.2"/><path d="M19.4 10.8c0-3.5-3.3-6.6-7.4-6.6"/><path d="M16.4 12.4v2.4a8 8 0 0 1-.8 3.5"/><path d="M12 9.6c-.9 0-1.6.8-1.6 1.7v3.1c0 1.9-.6 3.4-1.6 4.5"/><path d="M12 12.6v2.6c0 2.1-.8 3.9-2 5"/></svg></span><span class="rl" data-i18n="rail.knownhosts">Known Hosts</span></button>
        <button class="rail-item" data-nav="logs"><span class="ri"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2.2"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg></span><span class="rl" data-i18n="rail.logs">Logs</span></button>
      </nav>
    <section id="main">
      <div id="banner"></div>
      <div id="term-head">
        <span id="status-dot"></span>
        <span id="term-title">no session</span>
        <span style="flex:1"></span>
        <button id="btn-panel" class="btn" title="Show terminal side-panel" data-i18n-title="top.panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M15 4.5v15"/></svg></button>
        <button id="btn-tabview" class="btn" title="Workspace view" data-i18n-title="top.workspaceView"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="15" rx="1.6"/><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="14" width="7" height="5.5" rx="1.6"/></svg></button>
        <button id="btn-prefs" class="btn" title="Preferences (⌘,)" data-i18n-title="top.preferences"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.97z"/></svg></button>
        <button id="btn-sftp" class="btn" disabled title="SFTP browser (ssh session required)" data-i18n-title="top.sftp">⇄ SFTP</button>
      </div>
      <div id="main-body">
        <div id="ws-rail"></div>
        <div id="stage"></div>
        <div id="sidepanel">
          <div class="sp-head"><span data-i18n="panel.terminal">Terminal</span><span style="flex:1"></span>
            <button class="btn sp-close" title="Hide side-panel" data-i18n-title="panel.hide">✕</button></div>
          <div class="sp-sec">
            <div class="sp-title" data-i18n="panel.jumpTo">Jump to</div>
            <div id="jump-list" class="sp-list"></div>
          </div>
          <div class="sp-sec">
            <div class="sp-title" data-i18n="panel.snippets">Snippets</div>
            <div id="snip-list" class="sp-list"></div>
            <div class="snip-add">
              <input class="snip-name" placeholder="Name" data-i18n-placeholder="panel.snipName" spellcheck="false" autocomplete="off">
              <input class="snip-cmd" placeholder="Command" data-i18n-placeholder="panel.snipCommand" spellcheck="false" autocomplete="off">
              <button class="btn snip-save" data-i18n="panel.save">Save</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    </div>
  </div>
  <!-- Hosts / Vaults 分区的内容(工具栏 + 通栏搜索 + 分组标题 + 列表)。
     放在这里只为声明,启动时会被 **移动**(不是克隆)进 Vaults 视图,id 保持不变,
     这样主机面板原有的 id 绑定照旧生效。 -->
<div id="vault-src" hidden>
  <!-- 顺序照原版实测:搜索行在上(y 59..94),工具条在下(y 114..143) -->
  <div id="host-tools">
    <input id="host-search" type="text" placeholder="Find a host or ssh user@hostname..." data-i18n-placeholder="search.placeholder" spellcheck="false" autocomplete="off">
    <button id="btn-connect" disabled data-i18n="search.connect">Connect</button>
  </div>
  <div id="host-toolbar">
    <button id="btn-new-host" class="tb-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="toolbar.newHost">New host</span></button>
    <button id="btn-new-host-caret" class="tb-btn caret" title="New host options" data-i18n-title="toolbar.newHostOptions"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="btn-quick-term" class="tb-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l2.5 2L7 14M12.5 14H16"/></svg><span data-i18n="toolbar.terminal">Terminal</span></button>
    <button id="btn-quick-serial" class="tb-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 3v5M15 3v5M6 8h12v5a6 6 0 0 1-12 0V8ZM12 19v2"/></svg><span data-i18n="toolbar.serial">Serial</span></button>
    <span style="flex:1"></span>
    <button id="host-tags" class="tb-icon" title="Filter and sort" data-i18n-title="toolbar.tags" aria-label="Filter and sort" data-i18n-aria="toolbar.tags"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.6 2.6H21a.4.4 0 0 1 .4.4v9.4a1 1 0 0 1-.3.7l-8.4 8.4a1 1 0 0 1-1.4 0l-8.1-8.1a1 1 0 0 1 0-1.4l8.4-8.4a1 1 0 0 1 .7-.3Z"/><circle cx="17" cy="7" r="1.6" fill="var(--bg2)"/></svg></button>
    <button id="host-layout" class="tb-icon" title="Change layout" data-i18n-title="toolbar.layout" aria-label="Change layout" data-i18n-aria="toolbar.layout"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg></button>
    <button id="btn-appearance" class="tb-icon" title="Preferences (⌘,)" data-i18n-title="top.preferences" aria-label="Preferences" data-i18n-aria="top.preferences"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.97z"/></svg></button>
  </div>
  <div id="host-list"></div>
</div>
<div id="form-backdrop">
    <form id="host-form" autocomplete="off">      <h2 id="form-heading" data-i18n="form.newHost">New host</h2>
      <div class="row">
        <div><label data-i18n="form.name">Name</label><input id="f-name" placeholder="prod-1"></div>
        <div><label data-i18n="form.group">Group</label><input id="f-group" placeholder="work"></div>
      </div>
      <div class="row">
        <div style="flex:1"><label data-i18n="form.tags">Tags</label><input id="f-tags" placeholder="prod, db (comma separated)" data-i18n-placeholder="form.tagsHint"></div>
      </div>
      <div class="row">
        <div><label data-i18n="form.host">Host</label><input id="f-host" placeholder="10.0.0.5" required></div>
        <div style="max-width:90px"><label data-i18n="form.port">Port</label><input id="f-port" type="number" value="22" min="1" max="65535"></div>
      </div>
      <div class="row">
        <div><label data-i18n="form.username">Username</label><input id="f-username" placeholder="root" required></div>
        <div><label data-i18n="form.auth">Auth</label>
          <select id="f-auth">
            <option value="password" data-i18n="form.password">Password</option>
            <option value="key" data-i18n="form.privateKey">Private key</option>
            <option value="agent" data-i18n="form.sshAgent">SSH agent</option>
          </select>
        </div>
      </div>
      <div id="f-key-row"><label data-i18n="form.keyPath">Key path</label><input id="f-keypath" placeholder="~/.ssh/id_ed25519"></div>
      <div id="f-secret-row"><label id="f-secret-label" data-i18n="form.passwordSaved">Password (saved in Keychain)</label>
        <input id="f-secret" type="password" placeholder="••••••"></div>
      <div id="form-error"></div>
      <div id="form-actions">
        <button type="button" id="btn-cancel" class="btn" data-i18n="form.cancel">Cancel</button>
        <button type="submit" id="btn-save" class="btn primary" data-i18n="form.save">Save</button>
