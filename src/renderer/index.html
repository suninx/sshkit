<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <link rel="stylesheet" href="./xterm.css">
  <style>
    /* T1 复刻:原版终端字体 = MesloLGS Nerd Font Mono(Nerd Fonts 3.2.1,Apache-2.0)。
       字体取自上游官方 release,与原版包内文件逐字节一致;见 src/renderer/fonts/LICENSE.txt。 */
    @font-face {
      font-family: "MesloLGS NF";
      src: url("./fonts/MesloLGSNerdFontMono-Regular.ttf") format("truetype");
      font-weight: 400; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: "MesloLGS NF";
      src: url("./fonts/MesloLGSNerdFontMono-Bold.ttf") format("truetype");
      font-weight: 700; font-style: normal; font-display: block;
    }
    :root {
      --bg: #101418; --bg2: #161b22; --bg3: #1e252e;
      --fg: #d8dee9; --fg-dim: #6b7a8c; --accent: #88c0d0; --danger: #bf616a;
      --wire: #262d36; --h04: rgba(255,255,255,.04); --h05: rgba(255,255,255,.05); --h06: rgba(255,255,255,.06); --h07: rgba(255,255,255,.07); --h08: rgba(255,255,255,.08); --h09: rgba(255,255,255,.09); --h10: rgba(255,255,255,.1); --h11: rgba(255,255,255,.11); --h12: rgba(255,255,255,.12);
      --fg-strong: #ffffff;
      --term-bg: #141729; /* 终端主题底色,tab 条随之变化(原版实测如此) */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.4 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
    #app { display: flex; height: 100%; }

    /* sidebar */
    #sidebar { width: 240px; min-width: 200px; background: var(--bg2); border-right: 1px solid var(--wire);
      display: flex; flex-direction: column; }
    #sidebar .top { padding: 10px 12px 8px; display: flex; align-items: center; gap: 8px; }
    #sidebar .brand { font-weight: 600; letter-spacing: .3px; }
    #host-list { flex: 1; overflow-y: auto; padding: 2px 6px 8px; }
    .group-label { color: var(--fg-dim); font-size: 11px; text-transform: uppercase;
      letter-spacing: .6px; padding: 10px 8px 3px; }
    .host-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
      cursor: pointer; user-select: none; }
    .host-item:hover { background: var(--bg3); }
    .host-item.active { background: var(--bg3); outline: 1px solid var(--wire); }
    .host-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host-item .small { color: var(--fg-dim); font-size: 11px; }
    .host-item .btn { visibility: hidden; }
    .host-item:hover .btn { visibility: visible; }
    .empty-hint { color: var(--fg-dim); padding: 12px 10px; }

    /* buttons */
    .btn { border: 1px solid var(--wire); background: var(--bg3); color: var(--fg);
      border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
    .btn:hover { border-color: var(--fg-dim); }
    .btn.primary { background: #2e6b7a; border-color: #3f8ba0; color: #eafbff; }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* main area */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #banner { display: none; padding: 8px 14px; background: #4b2b31; color: #f0c4c9;
      border-bottom: 1px solid var(--danger); white-space: pre-wrap; }
    #banner.visible { display: block; }
    #term-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--bg2); border-bottom: 1px solid var(--wire); min-height: 34px; }
    #status-dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5563; }
    #status-dot.on { background: #a3be8c; } #status-dot.off { background: var(--danger); }
    #term-title { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #term-wrap { flex: 1; padding: 6px; min-height: 0; }
    #term { width: 100%; height: 100%; }

    /* T2 复刻 —— tab 条。原版实测:条高 51px、底色=终端主题底色(#141729)、
       tab 高 30px/圆角 10px、非活动=5% 白叠加、活动会话 tab=#21b568 20% 叠加、
       关闭按钮约 21×23 圆角 5、会话图标为绿色圆点。
       快捷键亦取自原版自身的 shortcut_schemes:Cmd+T 新建 / Cmd+W 关闭 /
       Cmd+Shift+[ ] 前后切换。 */
    #tabstrip { display: flex; align-items: center; gap: 6px; height: 51px; padding: 0 10px;
      background: var(--term-bg); border-bottom: 1px solid var(--wire); }
    #tabs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
    .tab-btn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 6px;
      border-radius: 10px; background: var(--h05); color: var(--term-fg); cursor: pointer;
      font-size: 13px; max-width: 240px; min-width: 0; user-select: none; flex: none; }
    .tab-btn:not(.session) { padding-left: 12px; }
    .tab-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7a8c; flex: none; }
    .tab-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-btn.active { background: var(--h10); color: var(--term-fg); }
    .tab-btn.session.active { background: rgba(33,181,104,.2); color: #21b568; }
    .tab-btn.session .dot.on { background: #21b568; }
    .tab-close { border: 0; background: transparent; color: inherit; opacity: .5; border-radius: 5px;
      width: 21px; height: 23px; padding: 0; cursor: pointer; font-size: 11px; flex: none; }
    .tab-close:hover { opacity: 1; background: var(--h12); }
    #btn-new-tab { width: 30px; height: 30px; border: 0; border-radius: 10px; background: transparent;
      color: var(--term-fg); font-size: 16px; cursor: pointer; flex: none; }
    #btn-new-tab:hover { background: var(--h08); }
    #stage { flex: 1; min-height: 0; position: relative; }
    /* 注意:类名必须与 SFTP 弹层的 .pane/.panes 区分开(否则 position:absolute 会把 SFTP 布局弄坏) */
    .tab-pane { position: absolute; inset: 0; display: none; }
    .tab-pane.active { display: block; }
    .tab-pane .term-host { position: relative; width: 100%; height: 100%; padding: 6px; box-sizing: border-box; }

    /* T4 复刻 —— 终端内搜索栏。原版实测:Cmd+F 在终端区右上出现,输入框占位符
       "Search terminal - ⌘ + F",右侧有上/下箭头按钮。 */
    .term-search { position: absolute; right: 10px; top: 8px; z-index: 5; display: flex; align-items: center;
      gap: 2px; background: var(--bg2); border: 1px solid var(--wire); border-radius: 10px; padding: 3px 4px 3px 10px; }
    .term-search[hidden] { display: none; }
    .term-search .ts-ico { display: flex; align-items: center; color: var(--accent); opacity: .9; }
    .term-search input { width: 220px; background: transparent; border: 0; outline: none; color: var(--fg);
      font-size: 13px; padding: 4px 2px; }
    .ts-btn { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; border-radius: 6px;
      width: 22px; height: 22px; font-size: 12px; }
    .ts-btn:hover { background: var(--h09); color: var(--fg); }

    /* T4 —— 未实现的快捷键显式告知(不静默吞键) */
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 60;
      background: rgba(20,23,41,.97); border: 1px solid var(--wire); color: var(--fg);
      padding: 9px 14px; border-radius: 9px; font-size: 13px; transition: opacity .5s; }
    .toast.out { opacity: 0; }

    /* T4 —— Cmd+K 命令面板 */
    .palette-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex;
      align-items: flex-start; justify-content: center; padding-top: 90px; z-index: 55; }
    .palette { width: min(560px, 88vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; overflow: hidden; }
    .palette input { width: 100%; box-sizing: border-box; background: transparent; border: 0;
      border-bottom: 1px solid var(--wire); outline: none; color: var(--fg); font-size: 14px; padding: 13px 15px; }
    .pal-list { max-height: 320px; overflow-y: auto; padding: 5px; }
    .pal-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .pal-row:hover { background: var(--h08); }
    .pal-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pal-hint { color: var(--fg-dim); font-size: 12px; }

    /* 新 tab 落地页。原版实测:居中搜索框(约占宽 667、高 36、圆角 10)、右侧 ⌘+K 提示、
       下方图标 + "Recent sessions" 标题(18px/500)+ 两行提示语。 */
    .newtab { height: 100%; display: flex; flex-direction: column; align-items: center; }
    .nt-search { position: relative; width: min(667px, 70%); margin-top: 41px; }
    .nt-search input { width: 100%; height: 36px; border-radius: 10px; border: 1px solid transparent;
      background: #d5dde0; color: #141729; padding: 0 64px 0 14px; font-size: 14px; outline: none; }
    .nt-search input:focus { border-color: #2091f6; }
    .nt-search .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #798c94; font-size: 14px; font-weight: 450; pointer-events: none; }
    .nt-empty { margin-top: 210px; text-align: center; color: var(--fg-dim); }
    .nt-icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 14px; background: #e6ebed;
      display: flex; align-items: center; justify-content: center; font-size: 26px; color: #141729; }
    .nt-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; color: var(--fg); }
    .nt-empty p { margin: 0; font-size: 14px; line-height: 1.55; }

    /* T2 复刻 —— tab 拖拽重排(原版有 over-horizontal-tab / over-draft-horizontal-tab 拖放态)、
       右键菜单(原版 TAB_CONTEXT_MENU_OPENED)与重命名(SINGLE_TERMINAL_TAB_RENAMED) */
    .tab-btn.dragging { opacity: .45; }
    .tab-btn.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
    .tab-btn.drop-after { box-shadow: inset -2px 0 0 var(--accent); }
    .tab-menu { position: fixed; z-index: 60; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 9px; padding: 5px; min-width: 150px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
    .tab-menu-item { display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: var(--fg); font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    .tab-menu-item:hover { background: var(--h08); }
    .tab-rename { width: 96px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent);
      border-radius: 5px; font-size: 13px; padding: 1px 4px; outline: none; }

    /* T5 复刻 —— 栏间拖拽传输的落点高亮 */
    .sp-row.dragging { opacity: .5; }
    .sp-body.drop-hot { outline: 2px dashed var(--accent); outline-offset: -3px; background: rgba(32,145,246,.06); }

    /* T2 复刻 —— 水平分屏(原版 `Split horizontally`)与广播(原版 `Broadcast`) */
    .tab-pane { display: flex; flex-direction: column; }
    .split-pane { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column;
      border-top: 1px solid var(--wire); }
    .split-head { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: var(--bg2);
      font-size: 12px; color: var(--fg-dim); }
    .split-bc { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .split-picker { display: flex; align-items: center; gap: 8px; padding: 10px; }
    .split-picker select { background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 7px; font-size: 12px; }
    .split-body { flex: 1; min-height: 0; }

    /* T6 复刻 —— Known Hosts 多选(原版有 Select All / Clear selection / Multi-Select Context Menu) */
    .kh-row.sel { background: rgba(32,145,246,.18); }
    .kh-selbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-bottom: 1px solid var(--wire); font-size: 12px; color: var(--fg-dim); }
    .kh-selbar:empty { display: none; }

    .tag-chip { display: inline-flex; align-items: center; gap: 3px; }
    .tag-x { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 9px;
      padding: 0 1px; line-height: 1; }
    .tag-x:hover { color: var(--danger); }

    /* T3 复刻 —— 端口转发。入口:侧栏一级导航 Port Forwarding;工具栏 `＋ New forwarding`;
       空态文案与向导四步的标签/说明均逐字取自原版实测(F17)。 */
    /* T1 复刻 —— 外观设置:配色方案 / 字号 / 字体。
       配色数据取自原版自身的 colorSchemesArray(64 套,见 renderer/themes.ts)。
       说明:原版把主题放在终端侧栏的调色板按钮里;我方没有侧栏,故收在终端标题栏的 🎨 里(有意偏离)。 */
    .prefs { position: absolute; right: 12px; top: 40px; z-index: 30; width: 320px; max-height: 70vh;
      background: var(--bg2); border: 1px solid var(--wire); border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .prefs h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; }
    .prefs-row { display: flex; align-items: center; gap: 8px; }
    .scheme-list { max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .scheme { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--fg);
      text-align: left; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .scheme:hover { background: var(--h07); }
    .scheme.on { background: var(--h12); }
    .swatches { display: flex; gap: 1px; }
    .swatches i { width: 9px; height: 14px; display: block; }
    .prefs input[type=number] { width: 62px; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 7px; font-size: 13px; }
    .prefs select { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 6px; font-size: 13px; }

    /* T7 复刻 —— 按标签过滤 + 布局切换(原版 Change layout 提供 List / Grid 两种,文案取自原版) */
    #host-tags, #host-layout { border: 1px solid var(--wire); background: var(--bg); color: var(--fg-dim);
      border-radius: 8px; width: 30px; cursor: pointer; font-size: 12px; }
    #host-tags:hover, #host-layout:hover { color: var(--fg); }
    #host-tags.on { color: var(--accent); border-color: var(--accent); }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 8px 5px 26px; }
    .tag-chip { font-size: 10px; color: var(--fg-dim); background: var(--h06);
      border-radius: 4px; padding: 1px 5px; }
    .tag-menu-item { display: flex; align-items: center; gap: 7px; }
    .tag-menu-item input { margin: 0; }
    #host-list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
    #host-list.grid .group-label { grid-column: 1 / -1; }
    #host-list.grid .host-item { flex-direction: column; align-items: flex-start; gap: 2px; }

    /* T7 复刻 —— 主机簿搜索与排序(占位符与排序项取自原版实测,见 F20) */
    #host-tools { display: flex; gap: 6px; padding: 0 10px 8px; }
    #host-search { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; }
    #host-search:focus { border-color: var(--accent); }
    #host-sort { border: 1px solid var(--wire); background: var(--bg); color: var(--fg-dim); border-radius: 8px;
      width: 32px; cursor: pointer; font-size: 13px; }
    #host-sort:hover { color: var(--fg); }
    .sort-menu { position: absolute; z-index: 20; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 9px; padding: 5px; min-width: 168px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .sort-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg);
      font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    .sort-item:hover { background: var(--h08); }
    .sort-item.on { color: var(--accent); }

    #nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
    .nav-item { display: flex; align-items: center; gap: 9px; border: 0; background: transparent;
      color: var(--fg); font-size: 14px; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .nav-item .ni { width: 18px; text-align: center; opacity: .85; }
    .nav-item:hover { background: var(--h07); }
    .nav-item.on { background: var(--h11); }
    .fwd { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .fwd-bar { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 14px; }
    .fwd-new { display: flex; }
    .fwd-new-main { border: 0; background: var(--bg3); color: var(--fg); font-size: 14px; font-weight: 500;
      padding: 8px 14px; border-radius: 9px 0 0 9px; cursor: pointer; }
    .fwd-new-caret { border: 0; border-left: 1px solid var(--wire); background: var(--bg3); color: var(--fg-dim);
      padding: 8px 8px; border-radius: 0 9px 9px 0; cursor: pointer; }
    .fwd-new-main:hover, .fwd-new-caret:hover { background: #2f3946; }
    .fwd-icon { border: 0; background: transparent; color: var(--fg-dim); font-size: 14px; cursor: pointer;
      padding: 6px 8px; border-radius: 7px; }
    .fwd-icon:hover { background: var(--h08); color: var(--fg); }
    .fwd-body { flex: 1; min-height: 0; overflow-y: auto; }
    .fwd-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fwd-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 20px; }
    .fwd-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
    .fwd-empty p { margin: 0; font-size: 14px; color: var(--fg-dim); }
    .fwd-list { display: flex; flex-direction: column; }
    .fwd-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--wire); }
    .fwd-row:hover { background: var(--h04); }
    .fwd-badge { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 700; background: var(--bg3); }
    .fwd-badge.local { background: rgba(32,145,246,.2); color: #6ba0c3; }
    .fwd-badge.remote { background: rgba(236,168,85,.2); color: #fdc47d; }
    .fwd-badge.dynamic { background: rgba(33,181,104,.2); color: #3ed7be; }
    .fwd-main { flex: 1; min-width: 0; }
    .fwd-title { font-size: 14px; }
    .fwd-sub { font-size: 12px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fwd-state { font-size: 12px; color: var(--fg-dim); }
    .fwd-state.running { color: #3ed7be; }
    .fwd-state.error { color: var(--danger); }
    .fwd-wiz-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex;
      align-items: center; justify-content: center; z-index: 45; }
    .fwd-wiz { width: min(620px, 92vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; display: flex; flex-direction: column; max-height: 82vh; }
    .fwd-wiz-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--wire); }
    .fwd-wiz-head .crumb { font-size: 13px; color: var(--fg-dim); }
    .fwd-wiz-body { padding: 18px 20px; overflow-y: auto; }
    .fwd-wiz-body h3 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
    .fwd-hint { margin: 0 0 16px; font-size: 13px; color: var(--fg-dim); line-height: 1.5; }
    .fwd-field { display: block; margin-bottom: 14px; }
    .fwd-field .cap { display: block; font-size: 12px; color: var(--fg-dim); margin-bottom: 5px; }
    .fwd-field input { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none; }
    .fwd-field input:focus { border-color: var(--accent); }
    .fwd-kinds { display: flex; gap: 10px; margin-bottom: 16px; }
    .fwd-kind { flex: 1; display: flex; align-items: center; gap: 9px; background: var(--bg3); border: 1px solid transparent;
      color: var(--fg); border-radius: 10px; padding: 12px; cursor: pointer; font-size: 14px; }
    .fwd-kind .k { width: 24px; height: 24px; border-radius: 7px; background: var(--h10);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .fwd-kind.on { border-color: var(--accent); background: rgba(32,145,246,.14); }
    .fwd-hostmenu { margin-top: 10px; background: var(--bg); border: 1px solid var(--wire); border-radius: 10px; padding: 6px; }
    .fwd-hostgroup { font-size: 12px; color: var(--fg-dim); padding: 6px 8px; }
    .fwd-hostitem { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
      color: var(--fg); text-align: left; padding: 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .fwd-hostitem:hover { background: var(--h08); }
    .fwd-hostitem .hs { color: var(--fg-dim); font-size: 12px; }
    .fwd-wiz-foot { display: flex; align-items: center; padding: 12px 14px; border-top: 1px solid var(--wire); }

    /* T6 复刻 —— 已知主机视图 + 主机密钥询问(文案取自原版,见 renderer/knownhosts.ts 注释) */
    .kh { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .kh-bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; }
    .kh-bar-title { font-size: 14px; font-weight: 500; }
    .kh-hint { font-size: 12px; color: var(--fg-dim); }
    .kh-body { flex: 1; min-height: 0; overflow-y: auto; }
    .kh-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .kh-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 20px; }
    .kh-empty h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
    .kh-empty p { margin: 0; font-size: 14px; color: var(--fg-dim); }
    .kh-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--wire); }
    .kh-row:hover { background: var(--h04); }
    .kh-ico { width: 26px; height: 26px; border-radius: 8px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 13px; }
    .kh-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .kh-host { font-size: 14px; }
    .kh-fp { font-size: 12px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kh-type { font-size: 12px; color: var(--fg-dim); }
    .hk-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
      align-items: center; justify-content: center; z-index: 70; }
    .hk-dialog { width: min(560px, 92vw); background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 12px; padding: 20px; }
    .hk-dialog h3 { margin: 0 0 14px; font-size: 18px; font-weight: 500; }
    .hk-dialog h3.error { color: var(--danger); }
    .hk-body { font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
    .hk-fp { font-family: ui-monospace, Menlo, monospace; word-break: break-all; color: var(--fg); }
    .hk-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* T8 复刻 —— 断线覆盖层与全局断开条(文案取自原版自身,见 F19) */
    .disc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10,12,22,.72); z-index: 8; }
    .disc-card { background: var(--bg2); border: 1px solid var(--wire); border-radius: 12px;
      padding: 18px 20px; min-width: 320px; text-align: center; }
    .disc-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
    .disc-reason { font-size: 13px; color: var(--fg-dim); margin-bottom: 16px; }
    .disc-actions { display: flex; gap: 8px; justify-content: center; }
    #disc-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 40; display: flex;
      align-items: center; gap: 10px; padding: 0 12px; background: #5a2b2b; color: var(--fg); font-size: 13px; }
    #disc-bar .btn { padding: 3px 10px; font-size: 12px; }

    /* host form (modal-ish) */
    #form-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
      align-items: center; justify-content: center; z-index: 10; }
    #form-backdrop.visible { display: flex; }
    #host-form { width: 360px; background: var(--bg2); border: 1px solid var(--wire);
      border-radius: 10px; padding: 16px; }
    #host-form h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    #host-form label { display: block; margin: 9px 0 4px; color: var(--fg-dim); font-size: 12px; }
    #host-form input, #host-form select { width: 100%; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 6px; padding: 6px 9px; font-size: 13px; outline: none; }
    #host-form input:focus, #host-form select:focus { border-color: var(--accent); }
    #host-form .row { display: flex; gap: 10px; }
    #host-form .row > div { flex: 1; }
    #form-error { color: var(--danger); min-height: 18px; margin-top: 8px; font-size: 12px; }
    #form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    /* T5 复刻 —— SFTP 双栏(作为 tab,不再是模态框)。
       尺寸/结构照原版实测:栏标题 14px/450、面包屑 14px/450、列头 12px/700、
       行两行式(名 + 权限串 10px)、行距 47、列宽 279/151/101/90(相对栏内缩进 20)、
       栏间 1px 分隔;远端未绑会话时显示 "Connect to host" + "Select host" 空态(18px/500)。
       原版那些颜色测自其浅色 UI,我方是深色 UI,故颜色改用本应用主题变量。 */
    .sftp { position: relative; height: 100%; display: flex; min-height: 0; background: var(--bg); }
    .sftp-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--wire); }
    .sftp-pane:last-of-type { border-right: 0; }
    .sp-head { display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 12px 0 20px; }
    .sp-head .sp-title { font-size: 14px; font-weight: 450; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-btn { border: 0; background: transparent; color: var(--fg); font-size: 14px; font-weight: 450;
      cursor: pointer; padding: 5px 8px; border-radius: 7px; white-space: nowrap; }
    .sp-btn:hover { background: var(--h08); }
    .sp-filter { padding: 0 20px 8px; }
    .sp-filter input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--wire);
      border-radius: 7px; padding: 5px 9px; font-size: 13px; outline: none; }
    .sp-crumbs { display: flex; align-items: center; gap: 2px; height: 50px; padding: 0 12px 0 16px; overflow: hidden; }
    .sp-arrow { border: 0; background: transparent; color: var(--fg); font-size: 15px; cursor: pointer;
      border-radius: 6px; padding: 2px 7px; }
    .sp-arrow:hover { background: var(--h08); }
    .sp-crumbs .seg { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 450;
      padding: 3px 7px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    .sp-crumbs .seg:hover { background: var(--h08); }
    .sp-crumbs .seg-ico { width: 14px; height: 12px; border-radius: 3px; background: var(--accent); opacity: .85; }
    .sp-cols { display: flex; align-items: center; height: 34px; padding: 0 8px 0 20px;
      font-size: 12px; font-weight: 700; border-top: 1px solid var(--wire); border-bottom: 1px solid var(--wire); }
    /* 窄宽度(两栏 + 侧栏同时开时)会让固定列把名称列挤到 0,出现"表头 Name 变 Na、行内文字互相压字"。
       改成:名称列有下限并可省略,其余列可收缩但有下限。 */
    .sp-cname, .sp-name { flex: 1 1 auto; min-width: 90px; overflow: hidden; }
    .sp-cname > span, .sp-cdate, .sp-csize, .sp-ckind { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-cdate { flex: 0 1 151px; min-width: 60px; } .sp-csize { flex: 0 1 101px; min-width: 46px; }
    .sp-ckind { flex: 0 1 90px; min-width: 44px; }
    .sp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .sp-rows { flex: 1; overflow-y: auto; }
    .sp-row { display: flex; align-items: center; height: 47px; padding: 0 8px 0 20px; cursor: default; }
    .sp-row:hover { background: var(--h05); }
    .sp-row.sel { background: rgba(32,145,246,.18); }
    .sp-row.up { cursor: pointer; }
    .sp-row.up .nm { font-weight: 600; }
    /* 注意:这条必须自带 min-width —— 早前那条 min-width:0 会让名称列在窄栏里塌成 24px(只剩图标,名字不可见)。 */
    .sp-name { flex: 1 1 auto; min-width: 90px; overflow: hidden; display: flex; align-items: center; gap: 9px; }
    .sp-ico { width: 18px; height: 18px; border-radius: 4px; flex: none; }
    .sp-ico.dir { background: #8ab4f8; } .sp-ico.file { background: #7f8c99; }
    .sp-label { min-width: 0; display: flex; flex-direction: column; }
    .sp-label .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-label .pm { font-size: 10px; font-weight: 450; color: var(--fg-dim); }
    .sp-date { flex: 0 1 151px; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .sp-size { flex: 0 1 101px; min-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .sp-kind { width: 90px; font-size: 13px; color: var(--fg-dim); }
    .sftp-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .sp-empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--bg3); display: flex;
      align-items: center; justify-content: center; font-size: 26px; margin-bottom: 22px; }
    .sftp-empty h3 { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
    .sftp-empty p { margin: 0 0 18px; font-size: 14px; color: var(--fg-dim); line-height: 1.5; text-align: center; }
    .sp-select { background: var(--bg3); color: var(--fg); border: 0; border-radius: 8px;
      padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .sp-select:hover { background: #2f3946; }
    .sp-menu { position: fixed; z-index: 30; min-width: 148px; background: var(--bg2);
      border: 1px solid var(--wire); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; }
    .sp-menu-title { padding: 6px 10px 4px; font-size: 12px; color: var(--fg-dim); }
    .sp-menu-item { border: 0; background: transparent; color: var(--fg); text-align: left;
      padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .sp-menu-item:hover { background: var(--h09); }
    .sp-menu-item.danger { color: var(--danger); }
    .sftp-queue { position: absolute; right: 14px; bottom: 14px; width: 340px;
      display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
    .job { display: flex; align-items: center; gap: 8px; font-size: 12px; background: var(--bg2);
      border: 1px solid var(--wire); border-radius: 7px; padding: 5px 8px; }
    .job .jname { flex: 0 0 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job .jbar { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .job .jfill { height: 100%; background: var(--accent); width: 0%; }
    .job.done .jfill { background: #a3be8c; width: 100%; }
    .job.err .jfill { background: var(--danger); }
    .job .jstat { width: 88px; text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .job.err .jstat { color: var(--danger); }
  
    /* ---- 分屏布局修正(放在样式表末尾,确保压过前面的规则)----
       前面有 `.tab-pane.active{display:block}`(0-2-0)与 `.tab-pane .term-host{height:100%}`(0-2-0),
       低特异度规则会被压过 —— 实测表现为:分屏后主终端仍是 block + height:100%,把分屏顶出视口(y=-339),
       页面还被撑出滚动(scrollY=439)。这里用同/更高特异度覆盖。 */
    body, #app { overflow: hidden; }
    .tab-pane.active { display: flex; flex-direction: column; }
    .tab-pane.active .term-host { flex: 1 1 50%; min-height: 0; height: auto; overflow: hidden; }
    .tab-pane.active .split-pane { flex: 1 1 50%; min-height: 0; }

    /* T2 复刻 —— 工作区视图(原版 tabVariant: workspaceVerticalTab / active-workspace-tab /
       toggleWorkspaceViewMode):tab 不再横向排在上方,而是竖排在终端左侧。 */
    #main-body { flex: 1 1 auto; min-height: 0; display: flex; }
    #main-body > #stage { flex: 1 1 auto; min-width: 0; min-height: 0; }
    #ws-rail { display: none; }
    body[data-tabview="workspace"] #tabstrip { display: none; }
    body[data-tabview="workspace"] #ws-rail { display: flex; flex-direction: column; width: 190px;
      flex: 0 0 190px; overflow-y: auto; border-right: 1px solid var(--wire); background: var(--bg2); }
    .ws-row { display: flex; align-items: center; gap: 7px; padding: 7px 9px; cursor: pointer;
      font-size: 12px; color: var(--fg-dim); border-bottom: 1px solid var(--wire); }
    .ws-row:hover { background: var(--h04); }
    .ws-row.active { background: rgba(32,145,246,.16); color: var(--fg); }
    .ws-row .ws-lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-row .ws-x { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; }
    .ws-row .ws-x:hover { color: var(--danger); }
    .ws-empty { padding: 10px; font-size: 12px; color: var(--fg-dim); }

    /* T4 复刻 —— 终端侧栏(原版 `Show terminal side-panel` / 动作 toggleSidepanel,
       内容含 Snippets / Serial / Jump to;具体文案与布局未取到,视觉为自设计) */
    #sidepanel { display: none; }
    body[data-panel="1"] #sidepanel { display: flex; flex-direction: column; width: 250px;
      flex: 0 0 250px; border-left: 1px solid var(--wire); background: var(--bg2); overflow-y: auto; }
    .sp-head { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 12px;
      color: var(--fg-dim); border-bottom: 1px solid var(--wire); }
    .sp-sec { padding: 8px 10px; border-bottom: 1px solid var(--wire); }
    .sp-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-dim);
      margin-bottom: 6px; }
    .sp-list { display: flex; flex-direction: column; gap: 2px; }
    .sp-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px;
      font-size: 12px; cursor: pointer; }
    .sp-item:hover { background: var(--h05); }
    .sp-item .sp-nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-item .sp-sub { color: var(--fg-dim); font-size: 11px; }
    .sp-del { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; }
    .sp-del:hover { color: var(--danger); }
    .snip-add { display: flex; gap: 4px; margin-top: 6px; }
    .snip-add input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
      border: 1px solid var(--wire); border-radius: 6px; padding: 4px 6px; font-size: 11px; }

    /* T8 复刻 —— 重连日志(原版 `Attempting reconnection to server with ID …`) */
    .disc-log { margin-top: 10px; text-align: left; max-width: 420px; }
    .disc-log-line { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-dim);
      opacity: .9; padding: 1px 0; }

    /* T5/T1 复刻 —— 浅色界面主题。
       诚实标注:原版**界面**浅色调色板未取到(ui-process 的 JS/CSS 里都没有可读的调色板定义,
       不像终端配色那样有 colorSchemesArray),所以下面这套浅色值是**自设计**的,
       只保证结构一致(同一组语义变量 + 硬编码覆盖层全部变量化)。 */
    body[data-ui="light"] {
      --bg: #f4f6f8; --bg2: #ffffff; --bg3: #eceff3;
      --fg: #1f2430; --fg-dim: #6b7280; --wire: #dde2e8;
      --accent: #2f6f8f; --danger: #c0392b; --fg-strong: #1f2430;
      --h04: rgba(0,0,0,.04);
      --h05: rgba(0,0,0,.05);
      --h06: rgba(0,0,0,.06);
      --h07: rgba(0,0,0,.07);
      --h08: rgba(0,0,0,.08);
      --h09: rgba(0,0,0,.09);
      --h10: rgba(0,0,0,.1);
      --h11: rgba(0,0,0,.11);
      --h12: rgba(0,0,0,.12);
    }

    /* T7 复刻 —— 标签颜色(自设计:原版数据形态取不到)与色点 */
    .tag-chip { border: 1px solid transparent; }
    .tag-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--wire);
      padding: 0; cursor: pointer; flex: none; }
    .tag-dot:hover { transform: scale(1.25); }
    .tag-pal { display: flex; align-items: center; gap: 4px; padding: 4px 2px; width: 100%; }
    .tag-sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--wire); cursor: pointer; }
    .tag-sw.on { outline: 2px solid var(--fg); outline-offset: 1px; }
    .tag-sw.clear { background: transparent; color: var(--fg-dim); font-size: 9px; line-height: 1; }

    /* 快捷键跳转到侧栏分区时的一次性高亮 */
    .sp-sec.sp-flash { background: rgba(32,145,246,.14); transition: background .25s; }
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="top">
        <span class="brand">sshkit</span>
        <span style="flex:1"></span>
        <button id="btn-new-host" class="btn">＋</button>
      </div>
      <div id="nav">
        <button class="nav-item on" data-nav="hosts"><span class="ni">🖧</span>Hosts</button>
        <button class="nav-item" data-nav="forwarding"><span class="ni">⇥</span>Port Forwarding</button>
        <button class="nav-item" data-nav="knownhosts"><span class="ni">🔑</span>Known Hosts</button>
      </div>
      <div id="host-tools">
        <input id="host-search" type="text" placeholder="Find a host or ssh user@hostname..." spellcheck="false" autocomplete="off">
        <button id="host-tags" title="Filter by tags" aria-label="Filter by tags">🏷</button>
        <button id="host-layout" title="Change layout" aria-label="Change layout">▤</button>
        <button id="host-sort" title="Sort options" aria-label="Sort options">⇅</button>
      </div>
      <div id="host-list"></div>
    </aside>
    <section id="main">
      <div id="banner"></div>
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="btn-new-tab" title="New Tab (⌘T)">＋</button>
      </div>
      <div id="term-head">
        <span id="status-dot"></span>
        <span id="term-title">no session</span>
        <span style="flex:1"></span>
        <button id="btn-panel" class="btn" title="Show terminal side-panel">▤</button>
        <button id="btn-tabview" class="btn" title="Workspace view">▥</button>
        <button id="btn-prefs" class="btn" title="Appearance — theme / font">🎨</button>
        <button id="btn-sftp" class="btn" disabled title="SFTP browser (ssh session required)">⇄ SFTP</button>
      </div>
      <div id="main-body">
        <div id="ws-rail"></div>
        <div id="stage"></div>
        <div id="sidepanel">
          <div class="sp-head"><span>Terminal</span><span style="flex:1"></span>
            <button class="btn sp-close" title="Hide side-panel">✕</button></div>
          <div class="sp-sec">
            <div class="sp-title">Jump to</div>
            <div id="jump-list" class="sp-list"></div>
          </div>
          <div class="sp-sec">
            <div class="sp-title">Snippets</div>
            <div id="snip-list" class="sp-list"></div>
            <div class="snip-add">
              <input class="snip-name" placeholder="Name" spellcheck="false" autocomplete="off">
              <input class="snip-cmd" placeholder="Command" spellcheck="false" autocomplete="off">
              <button class="btn snip-save">Save</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="form-backdrop">
    <form id="host-form" autocomplete="off">      <h2 id="form-heading">New host</h2>
      <div class="row">
        <div><label>Name</label><input id="f-name" placeholder="prod-1"></div>
        <div><label>Group</label><input id="f-group" placeholder="work"></div>
      </div>
      <div class="row">
        <div style="flex:1"><label>Tags</label><input id="f-tags" placeholder="prod, db (逗号分隔)"></div>
      </div>
      <div class="row">
        <div><label>Host</label><input id="f-host" placeholder="10.0.0.5" required></div>
        <div style="max-width:90px"><label>Port</label><input id="f-port" type="number" value="22" min="1" max="65535"></div>
      </div>
      <div class="row">
        <div><label>Username</label><input id="f-username" placeholder="root" required></div>
        <div><label>Auth</label>
          <select id="f-auth">
            <option value="password">Password</option>
            <option value="key">Private key</option>
            <option value="agent">SSH agent</option>
          </select>
        </div>
      </div>
      <div id="f-key-row"><label>Key path</label><input id="f-keypath" placeholder="~/.ssh/id_ed25519"></div>
      <div id="f-secret-row"><label id="f-secret-label">Password (saved in Keychain)</label>
